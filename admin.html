*{

}

body{

}

button,
input,
textarea,
select{

}

button{

}

header{
  background:#4b281d;
  color:white;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:50;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{

  font-weight:bold;
}

.logo span{
  color:#e0b35b;
}

.logout{
  background:#e0b35b;

}

.container{
  max-width:1200px;
  margin:auto;

}

h1{
  margin-top:0;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.tab{
  border:1px solid #d8cbc4;
  background:white;
  color:#4b281d;
  padding:11px 15px;
  border-radius:10px;
}

.tab.active{
  background:#4b281d;
  color:white;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.box{

  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(70,35,20,.07);
}

.box h2{
  margin-top:0;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:18px;
}

.product-card{

}

.product-img{

  border-radius:12px;
  overflow:hidden;
  background:#f2e6df;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  margin-bottom:12px;
}

.product-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:11px;
  border:1px solid #d8cbc4;
  border-radius:9px;
  background:white;
  color:#4b281d;
  font-size:15px;
}

.field textarea{
  min-height:75px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.btn{
  border:0;
  padding:11px;
  border-radius:9px;
  font-weight:bold;
}

.btn-save{
  background:#4b281d;
  color:white;
}

.btn-delete{
  background:#a33e3e;
  color:white;
}

.btn-new{
  background:#e0b35b;
  color:#4b281d;
}

.btn-cancel{
  background:#e9ded8;
  color:#4b281d;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:10px;
}

.status.on{
  background:#dff3df;
  color:#276227;
}

.status.off{
  background:#f7dddd;
  color:#8a2828;
}

.notice{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
}

.notice.show{
  display:block;
}

.notice.success{
  background:#def3df;
  color:#236329;
}

.notice.error{
  background:#ffe1e1;
  color:#8b2525;
}

.loading{
  text-align:center;
  padding:35px;
  color:#765b51;
}

.empty{
  text-align:center;
  padding:35px;
  color:#765b51;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:28px;
  box-shadow:0 8px 30px rgba(70,35,20,.12);
}

.login-box h1{
  text-align:center;
}

.login-box button{
  width:100%;
  border:0;
  background:#4b281d;
  color:white;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
}

.hidden{
  display:none!important;
}

.orders{
  display:grid;
  gap:12px;
}

.order{
  border:1px solid #e4d9d3;
  border-radius:12px;
  padding:15px;
  background:white;
}

.order strong{
  display:block;
  margin-bottom:6px;
}

.small{
  font-size:13px;
  color:#765b51;
}

.save-all{
  background:#4b281d;
  color:white;
  border:0;
  padding:13px 18px;
  border-radius:10px;
  font-weight:bold;
}

@media(max-width:600px){

  .row{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .container{
    padding:18px 12px 40px;
  }

}

</style>

</head>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://lzihqkpscesurkfmcasb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_okTsv4Dxh12-D-3a2x2gyg_H37xXvnG";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   VARIÁVEIS
================================================== */

let produtos = [];

let pedidos = [];

let loja = null;

let usuarioLogado = false;


/* ==================================================
   UTILIDADES
================================================== */

function mostrarMensagem(
  mensagem,
  tipo="success"
){

  const box =
    document.getElementById(
      "globalNotice"
    );

  box.textContent =
    mensagem;

  box.className =
    "notice show " +
    tipo;

  setTimeout(() => {

    box.classList.remove(
      "show"
    );

  },5000);

}


function mostrarLoginErro(
  mensagem
){

  const box =
    document.getElementById(
      "loginError"
    );

  box.textContent =
    mensagem;

  box.classList.add(
    "show"
  );

}


function escapeHTML(valor){

  return String(
    valor ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function dinheiro(valor){

  return Number(
    valor || 0
  )
  .toFixed(2)
  .replace(".",",");

}


/* ==================================================
   LOGIN
================================================== */

async function entrar(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const senha =
    document.getElementById(
      "loginPassword"
    ).value;

  if(!email || !senha){

    mostrarLoginErro(
      "Digite seu e-mail e sua senha."
    );

    return;

  }

  const botao =
    document.querySelector(
      ".login-box button"
    );

  botao.disabled = true;

  botao.textContent =
    "Entrando...";

  try{

    /*
      Primeiro tentamos Supabase Auth.
      Isso é mais seguro quando o projeto
      estiver usando autenticação do Supabase.
    */

    const {data,error} =
      await supabaseClient.auth
        .signInWithPassword({
          email:email,
          password:senha
        });

    if(error){

      /*
        Compatibilidade com o sistema antigo:
        se não existir usuário no Auth,
        verificamos a tabela admins.
      */

      const resultado =
        await supabaseClient
          .from("admins")
          .select("id,email,password_hash")
          .eq("email",email)
          .limit(1)
          .maybeSingle();

      if(resultado.error){

        throw resultado.error;

      }

      if(!resultado.data){

        throw new Error(
          "E-mail ou senha incorretos."
        );

      }

      /*
        Atenção:
        password_hash deve ser substituído
        pelo sistema de autenticação do Supabase.
        Não guardamos senha em texto puro.
      */

      if(
        resultado.data.password_hash !== senha
      ){

        throw new Error(
          "E-mail ou senha incorretos."
        );

      }

      usuarioLogado = true;

    }else{

      if(!data.session){

        throw new Error(
          "Não foi possível iniciar a sessão."
        );

      }

      usuarioLogado = true;

    }

    document
      .getElementById(
        "loginScreen"
      )
      .classList.add("hidden");

    document
      .getElementById(
        "adminScreen"
      )
      .classList.remove("hidden");

    await carregarTudo();

  }catch(error){

    console.error(
      "Erro no login:",
      error
    );

    mostrarLoginErro(
      error.message ||
      "Não foi possível entrar."
    );

  }finally{

    botao.disabled =
      false;

    botao.textContent =
      "Entrar";

  }

}


/* ==================================================
   SAIR
================================================== */

async function sair(){

  try{

    await supabaseClient.auth.signOut();

  }catch(error){

    console.error(error);

  }

  usuarioLogado = false;

  document
    .getElementById(
      "adminScreen"
    )
    .classList.add("hidden");

  document
    .getElementById(
      "loginScreen"
    )
    .classList.remove("hidden");

}


/* ==================================================
   ABAS
================================================== */

function abrirAba(
  nome,
  botao
){

  document
    .querySelectorAll(".panel")
    .forEach(
      painel =>
        painel.classList.remove(
          "active"
        )
    );

  document
    .querySelectorAll(".tab")
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );

  document
    .getElementById(nome)
    .classList.add("active");

  botao.classList.add("active");

}


/* ==================================================
   PRODUTOS - CARREGAR
================================================== */

async function carregarProdutos(){

  const area =
    document.getElementById(
      "listaProdutos"
    );

  area.innerHTML = `
    <div class="loading">
      Carregando produtos...
    </div>
  `;

  try{

    const {data,error} =
      await supabaseClient
        .from("products")
        .select(
          "id,name,category,price,description,image,active,created_at"
        )
        .order(
          "created_at",
          {ascending:false}
        );

    if(error){

      throw error;

    }

    produtos =
      Array.isArray(data)
        ? data
        : [];

    renderizarProdutos();

  }catch(error){

    console.error(
      "Produtos:",
      error
    );

    area.innerHTML = `
      <div class="empty">
        Erro ao carregar produtos.
        <br><br>
        ${escapeHTML(
          error.message
        )}
      </div>
    `;

  }

}


/* ==================================================
   PRODUTOS - RENDER
================================================== */

function renderizarProdutos(){

  const area =
    document.getElementById(
      "listaProdutos"
    );

  if(!produtos.length){

    area.innerHTML = `
      <div class="empty">
        Nenhum produto cadastrado.
      </div>
    `;

    return;

  }

  area.innerHTML = "";

  produtos.forEach(
    produto => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "product-card";

      const imagem =
        produto.image
          ? `
            <img
              src="${escapeHTML(
                produto.image
              )}"
              alt="${escapeHTML(
                produto.name
              )}"
            >
          `
          : "🍰";

      const status =
        produto.active
          ? `
            <span class="status on">
              ATIVO
            </span>
          `
          : `
            <span class="status off">
              INATIVO
            </span>
          `;

      card.innerHTML = `

        <div class="product-img">
          ${imagem}
        </div>

        ${status}

        <h3>
          ${escapeHTML(
            produto.name
          )}
        </h3>

        <div class="small">
          Categoria:
          ${escapeHTML(
            produto.category
          )}
        </div>

        <p>
          ${escapeHTML(
            produto.description
          )}
        </p>

        <strong
          style="
            display:block;
            font-size:21px;
            color:#b47b20;
            margin:10px 0;
          ">

          R$ ${dinheiro(
            produto.price
          )}

        </strong>

        <div class="actions">

          <button
            class="btn btn-save"
            data-action="editar"
            data-id="${produto.id}">

            ✏️ Editar

          </button>

          <button
            class="btn btn-delete"
            data-action="excluir"
            data-id="${produto.id}">

            🗑️ Excluir

          </button>

        </div>

      `;

      area.appendChild(card);

    }
  );

}


/* ==================================================
   EVENTOS DOS PRODUTOS
================================================== */

document.addEventListener(
  "click",
  function(event){

    const botao =
      event.target.closest(
        "[data-action]"
      );

    if(!botao){
      return;
    }

    const id =
      Number(
        botao.dataset.id
      );

    const acao =
      botao.dataset.action;

    if(acao === "editar"){

      editarProduto(id);

    }

    if(acao === "excluir"){

      excluirProduto(id);

    }

  }
);


/* ==================================================
   NOVO PRODUTO
================================================== */

function novoProduto(){

  document
    .getElementById(
      "editorProduto"
    )
    .classList.remove(
      "hidden"
    );

  document.getElementById(
    "editorTitulo"
  ).textContent =
    "Novo produto";

  document.getElementById(
    "produtoId"
  ).value = "";

  document.getElementById(
    "produtoNome"
  ).value = "";

  document.getElementById(
    "produtoCategoria"
  ).value = "bolos";

  document.getElementById(
    "produtoPreco"
  ).value = "";

  document.getElementById(
    "produtoDescricao"
  ).value = "";

  document.getElementById(
    "produtoImagem"
  ).value = "";

  document.getElementById(
    "produtoAtivo"
  ).checked = true;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==================================================
   EDITAR PRODUTO
================================================== */

function editarProduto(id){

  const produto =
    produtos.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!produto){

    mostrarMensagem(
      "Produto não encontrado.",
      "error"
    );

    return;

  }

  document
    .getElementById(
      "editorProduto"
    )
    .classList.remove(
      "hidden"
    );

  document.getElementById(
    "editorTitulo"
  ).textContent =
    "Editar produto";

  document.getElementById(
    "produtoId"
  ).value =
    produto.id;

  document.getElementById(
    "produtoNome"
  ).value =
    produto.name || "";

  document.getElementById(
    "produtoCategoria"
  ).value =
    produto.category || "bolos";

  document.getElementById(
    "produtoPreco"
  ).value =
    produto.price ?? "";

  document.getElementById(
    "produtoDescricao"
  ).value =
    produto.description || "";

  document.getElementById(
    "produtoImagem"
  ).value =
    produto.image || "";

  document.getElementById(
    "produtoAtivo"
  ).checked =
    produto.active !== false;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==================================================
   FECHAR EDITOR
================================================== */

function fecharEditor(){

  document
    .getElementById(
      "editorProduto"
    )
    .classList.add(
      "hidden"
    );

}


/* ==================================================
   SALVAR PRODUTO
================================================== */

async function salvarProduto(){

  const id =
    document.getElementById(
      "produtoId"
    ).value;

  const nome =
    document.getElementById(
      "produtoNome"
    ).value.trim();

  const categoria =
    document.getElementById(
      "produtoCategoria"
    ).value;

  const precoTexto =
    document.getElementById(
      "produtoPreco"
    ).value;

  const descricao =
    document.getElementById(
      "produtoDescricao"
    ).value.trim();

  const imagem =
    document.getElementById(
      "produtoImagem"
    ).value.trim();

  const ativo =
    document.getElementById(
      "produtoAtivo"
    ).checked;

  if(!nome){

    mostrarMensagem(
      "Digite o nome do produto.",
      "error"
    );

    return;

  }

  const preco =
    Number(
      precoTexto
    );

  if(
    !Number.isFinite(preco) ||
    preco < 0
  ){

    mostrarMensagem(
      "Digite um preço válido.",
      "error"
    );

    return;

  }

  const dados = {

    name:nome,

    category:
      categoria,

    price:
      preco,

    description:
      descricao || null,

    image:
      imagem || null,

    active:
      ativo

  };

  try{

    if(id){

      /*
        UPDATE pelo ID específico.
        Isso impede que o código altere
        apenas os primeiros produtos.
      */

      const {data,error} =
        await supabaseClient
          .from("products")
          .update(dados)
          .eq(
            "id",
            Number(id)
          )
          .select()
          .single();

      if(error){

        throw error;

      }

      /*
        Atualiza imediatamente a lista local.
      */

      const indice =
        produtos.findIndex(
          item =>
            Number(item.id) ===
            Number(id)
        );

      if(indice !== -1){

        produtos[indice] =
          data;

      }

      mostrarMensagem(
        "Produto atualizado com sucesso!"
      );

    }else{

      const {data,error} =
        await supabaseClient
          .from("products")
          .insert([
            dados
          ])
          .select()
          .single();

      if(error){

        throw error;

      }

      produtos.unshift(
        data
      );

      mostrarMensagem(
        "Produto criado com sucesso!"
      );

    }

    renderizarProdutos();

    fecharEditor();

  }catch(error){

    console.error(
      "Salvar produto:",
      error
    );

    mostrarMensagem(
      "Não foi possível salvar o produto: " +
      error.message,
      "error"
    );

  }

}


/* ==================================================
   EXCLUIR PRODUTO
================================================== */

async function excluirProduto(id){

  const produto =
    produtos.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!produto){

    mostrarMensagem(
      "Produto não encontrado.",
      "error"
    );

    return;

  }

  const confirmou =
    confirm(
      'Deseja realmente retirar "' +
      produto.name +
      '" do site?'
    );

  if(!confirmou){
    return;
  }

  try{

    /*
      Em vez de DELETE definitivo,
      desativamos o produto.

      Assim pedidos antigos continuam
      preservados no banco.
    */

    const {data,error} =
      await supabaseClient
        .from("products")
        .update({
          active:false
        })
        .eq(
          "id",
          Number(id)
        )
        .select()
        .single();

    if(error){

      throw error;

    }

    const indice =
      produtos.findIndex(
        item =>
          Number(item.id) ===
          Number(id)
      );

    if(indice !== -1){

      produtos[indice] =
        data;

    }

    renderizarProdutos();

    mostrarMensagem(
      "Produto retirado do site com sucesso!"
    );

  }catch(error){

    console.error(
      "Excluir produto:",
      error
    );

    mostrarMensagem(
      "Não foi possível excluir o produto: " +
      error.message,
      "error"
    );

  }

}


/* ==================================================
   PEDIDOS
================================================== */

async function carregarPedidos(){

  const area =
    document.getElementById(
      "listaPedidos"
    );

  area.innerHTML = `
    <div class="loading">
      Carregando pedidos...
    </div>
  `;

  try{

    const {data,error} =
      await supabaseClient
        .from("orders")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    if(error){

      throw error;

    }

    pedidos =
      Array.isArray(data)
        ? data
        : [];

    renderizarPedidos();

  }catch(error){

    console.error(error);

    area.innerHTML = `
      <div class="empty">
        Não foi possível carregar os pedidos.
        <br><br>
        ${escapeHTML(
          error.message
        )}
      </div>
    `;

  }

}


function renderizarPedidos(){

  const area =
    document.getElementById(
      "listaPedidos"
    );

  if(!pedidos.length){

    area.innerHTML = `
      <div class="empty">
        Nenhum pedido encontrado.
      </div>
    `;

    return;

  }

  area.innerHTML = "";

  pedidos.forEach(
    pedido => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "order";

      div.innerHTML = `

        <strong>
          Pedido #${escapeHTML(
            pedido.id
          )}
        </strong>

        <div>
          Cliente:
          ${escapeHTML(
            pedido.customer_name
          )}
        </div>

        <div>
          WhatsApp:
          ${escapeHTML(
            pedido.customer_phone
          )}
        </div>

        <div>
          Data:
          ${escapeHTML(
            pedido.scheduled_date
          )}
        </div>

        <div>
          Horário:
          ${escapeHTML(
            pedido.scheduled_time
          )}
        </div>

        <div>
          Total:
          <strong>
            R$ ${dinheiro(
              pedido.total
            )}
          </strong>
        </div>

        <div class="small">
          Status:
          ${escapeHTML(
            pedido.status || "pendente"
          )}
        </div>

        <div style="margin-top:10px">

          <select
            onchange="
              alterarStatusPedido(
                ${pedido.id},
                this.value
              )
            ">

            <option value="pendente"
              ${pedido.status==="pendente"?"selected":""}>
              Pendente
            </option>

            <option value="confirmado"
              ${pedido.status==="confirmado"?"selected":""}>
              Confirmado
            </option>

            <option value="preparando"
              ${pedido.status==="preparando"?"selected":""}>
              Preparando
            </option>

            <option value="pronto"
              ${pedido.status==="pronto"?"selected":""}>
              Pronto
            </option>

            <option value="entregue"
              ${pedido.status==="entregue"?"selected":""}>
              Entregue
            </option>

            <option value="cancelado"
              ${pedido.status==="cancelado"?"selected":""}>
              Cancelado
            </option>

          </select>

        </div>

      `;

      area.appendChild(div);

    }
  );

}


/* ==================================================
   ALTERAR STATUS PEDIDO
================================================== */

async function alterarStatusPedido(
  id,
  status
){

  try{

    const {error} =
      await supabaseClient
        .from("orders")
        .update({
          status:status
        })
        .eq(
          "id",
          Number(id)
        );

    if(error){

      throw error;

    }

    const pedido =
      pedidos.find(
        item =>
          Number(item.id) ===
          Number(id)
      );

    if(pedido){

      pedido.status =
        status;

    }

    mostrarMensagem(
      "Status do pedido atualizado!"
    );

  }catch(error){

    console.error(error);

    mostrarMensagem(
      "Não foi possível atualizar o pedido: " +
      error.message,
      "error"
    );

    await carregarPedidos();

  }

}


/* ==================================================
   LOJA
================================================== */

async function carregarLoja(){

  try{

    const {data,error} =
      await supabaseClient
        .from("store_settings")
        .select("*")
        .limit(1)
        .maybeSingle();

    if(error){

      throw error;

    }

    loja =
      data || null;

    if(!loja){

      return;

    }

    document.getElementById(
      "lojaNome"
    ).value =
      loja.store_name || "";

    document.getElementById(
      "lojaDescricao"
    ).value =
      loja.description || "";

    document.getElementById(
      "lojaTelefone"
    ).value =
      loja.phone || "";

    document.getElementById(
      "lojaWhatsapp"
    ).value =
      loja.whatsapp || "";

    document.getElementById(
      "lojaEndereco"
    ).value =
      loja.address || "";

    document.getElementById(
      "lojaInstagram"
    ).value =
      loja.instagram || "";

    document.getElementById(
      "lojaHorario"
    ).value =
      loja.opening_hours || "";

    document.getElementById(
      "lojaPix"
    ).value =
      loja.pix_key || "";

    document.getElementById(
      "lojaTaxa"
    ).value =
      loja.delivery_fee ?? 0;

  }catch(error){

    console.error(
      "Loja:",
      error
    );

    mostrarMensagem(
      "Não foi possível carregar as informações da loja.",
      "error"
    );

  }

}


/* ==================================================
   SALVAR LOJA
================================================== */

async function salvarLoja(){

  const dados = {

    store_name:
      document.getElementById(
        "lojaNome"
      ).value.trim(),

    description:
      document.getElementById(
        "lojaDescricao"
      ).value.trim(),

    phone:
      document.getElementById(
        "lojaTelefone"
      ).value.trim(),

    whatsapp:
      document.getElementById(
        "lojaWhatsapp"
      ).value.trim(),

    address:
      document.getElementById(
        "lojaEndereco"
      ).value.trim(),

    instagram:
      document.getElementById(
        "lojaInstagram"
      ).value.trim(),

    opening_hours:
      document.getElementById(
        "lojaHorario"
      ).value.trim(),

    pix_key:
      document.getElementById(
        "lojaPix"
      ).value.trim(),

    delivery_fee:
      Number(
        document.getElementById(
          "lojaTaxa"
        ).value || 0
      ),

    updated_at:
      new Date().toISOString()

  };

  try{

    if(loja && loja.id){

      const {data,error} =
        await supabaseClient
          .from("store_settings")
          .update(dados)
          .eq(
            "id",
            loja.id
          )
          .select()
          .single();

      if(error){

        throw error;

      }

      loja =
        data;

    }else{

      const {data,error} =
        await supabaseClient
          .from("store_settings")
          .insert([
            dados
          ])
          .select()
          .single();

      if(error){

        throw error;

      }

      loja =
        data;

    }

    mostrarMensagem(
      "Informações da loja salvas com sucesso!"
    );

  }catch(error){

    console.error(
      "Salvar loja:",
      error
    );

    mostrarMensagem(
      "Não foi possível salvar as informações: " +
      error.message,
      "error"
    );

  }

}


/* ==================================================
   CARREGAR TUDO
================================================== */

async function carregarTudo(){

  await Promise.all([
    carregarProdutos(),
    carregarPedidos(),
    carregarLoja()
  ]);

}


/* ==================================================
   INICIALIZAÇÃO
================================================== */

async function iniciar(){

  try{

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();

    if(
      data &&
      data.session
    ){

      usuarioLogado = true;

      document
        .getElementById(
          "loginScreen"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "adminScreen"
        )
        .classList.remove(
          "hidden"
        );

      await carregarTudo();

    }

  }catch(error){

    console.error(
      "Inicialização:",
      error
    );

  }

}


iniciar();
