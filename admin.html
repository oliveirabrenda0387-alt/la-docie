<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo | Lá Dociê</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fffaf7;
  color:#4b281d
}
header{
  background:#4b281d;
  color:#fff;
  padding:18px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10
}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;opacity:.8}
main{max-width:1000px;margin:auto;padding:18px}
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #00000012
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px
}
textarea{min-height:90px;resize:vertical}
button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  background:#4b281d;
  color:white;
  font-weight:bold;
  cursor:pointer
}
button:hover{opacity:.9}
.btn-secondary{background:#8b6b5c}
.btn-danger{background:#a33d3d}
.btn-success{background:#587b55}
.hidden{display:none!important}
.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}
.menu button{
  min-height:90px;
  font-size:15px
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}
.top h2{margin:0}
.item{
  background:#fffaf7;
  border:1px solid #eaded7;
  border-radius:14px;
  padding:15px;
  margin-top:12px
}
.item img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px
}
.message{
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  background:#fff0e9
}
.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding-bottom:10px
}
.status{
  background:#eadbd3;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold
}
.order-info p{margin:7px 0}
.order-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:8px 0
}
.empty{text-align:center;padding:30px;color:#777}
label{font-weight:bold;display:block;margin-top:8px}
@media(max-width:600px){
  main{padding:10px}
  .card{padding:15px}
  .menu{grid-template-columns:1fr 1fr}
  .actions{grid-template-columns:1fr}
  .order-head{align-items:flex-start}
  header h1{font-size:21px}
}
</style>

</head>

<body>

<header>
  <h1>🍰 LÁ DOCIÊ</h1>
  <p>Painel Administrativo</p>
</header>

<main>

<!-- LOGIN -->

<section id="login" class="card">
  <h2>🔐 Acesso administrativo</h2>

  <input id="email" type="email" placeholder="E-mail">
  <input id="senha" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

  <div id="loginMsg"></div>
</section>

<!-- PAINEL -->

<section id="painel" class="hidden">

  <div class="card">
    <h2>Olá! 👋</h2>
    <p>Bem-vinda ao painel da <b>Lá Dociê</b>.</p>

```
<div class="menu">
  <button onclick="produtos()">🍰<br>Produtos</button>
  <button onclick="pedidos()">📦<br>Pedidos</button>
  <button onclick="configuracoes()">⚙️<br>Configurações</button>
  <button onclick="novoProduto()">➕<br>Novo produto</button>
</div>

<button class="btn-danger" style="width:100%;margin-top:12px"
  onclick="logout()">Sair</button>
```

  </div>

  <!-- PRODUTOS -->

  <section id="produtos" class="card hidden">

```
<div class="top">
  <h2>🍰 Produtos</h2>
  <button class="btn-secondary" onclick="menu()">Voltar</button>
</div>

<button style="margin-top:12px" onclick="novoProduto()">
  ➕ Novo produto
</button>

<button class="btn-secondary" onclick="carregarProdutos()">
  🔄 Atualizar
</button>

<div id="listaProdutos">Carregando...</div>
```

  </section>

  <!-- FORM PRODUTO -->

  <section id="formProduto" class="card hidden">

```
<div class="top">
  <h2 id="formTitulo">➕ Novo produto</h2>
  <button class="btn-secondary" onclick="produtos()">Voltar</button>
</div>

<input id="produtoId" type="hidden">

<label>Nome</label>
<input id="produtoNome" placeholder="Nome do produto">

<label>Categoria</label>
<input id="produtoCategoria" placeholder="Bolos, Doces, Kits...">

<label>Preço</label>
<input id="produtoPreco" type="number" step="0.01" placeholder="0,00">

<label>Descrição</label>
<textarea id="produtoDescricao"></textarea>

<label>Link da imagem</label>
<input id="produtoImagem" placeholder="https://...">

<label>
  <input id="produtoAtivo" type="checkbox" checked style="width:auto">
  Produto ativo
</label>

<button onclick="salvarProduto()">💾 Salvar produto</button>

<div id="produtoMsg"></div>
```

  </section>

  <!-- PEDIDOS -->

  <section id="pedidos" class="card hidden">

```
<div class="top">
  <h2>📦 Pedidos</h2>
  <button class="btn-secondary" onclick="menu()">Voltar</button>
</div>

<button class="btn-secondary" onclick="carregarPedidos()">
  🔄 Atualizar pedidos
</button>

<div id="listaPedidos">Carregando...</div>
```

  </section>

  <!-- CONFIGURAÇÕES -->

  <section id="config" class="card hidden">

```
<div class="top">
  <h2>⚙️ Configurações</h2>
  <button class="btn-secondary" onclick="menu()">Voltar</button>
</div>

<label>Nome da loja</label>
<input id="cfgNome">

<label>Descrição</label>
<textarea id="cfgDescricao"></textarea>

<label>Telefone</label>
<input id="cfgTelefone">

<label>WhatsApp</label>
<input id="cfgWhatsapp">

<label>Chave Pix</label>
<input id="cfgPix">

<label>Taxa de entrega</label>
<input id="cfgTaxa" type="number" step="0.01">

<label>Horário de funcionamento</label>
<textarea id="cfgHorario"></textarea>

<label>Endereço</label>
<input id="cfgEndereco">

<label>Instagram</label>
<input id="cfgInstagram">

<button onclick="salvarConfig()">💾 Salvar configurações</button>

<div id="configMsg"></div>
```

  </section>

</section>
</main>

<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://lzihqkpscesurkfmcasb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_okTsv4Dxh12-D-3a2x2gyg_H37xXvnG";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   UTILIDADES
============================== */

function $(id){
  return document.getElementById(id);
}

function dinheiro(v){
  return Number(v||0)
    .toFixed(2)
    .replace(".",",");
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function esconderTudo(){
  $("login").classList.add("hidden");
  $("painel").classList.add("hidden");
  $("produtos").classList.add("hidden");
  $("formProduto").classList.add("hidden");
  $("pedidos").classList.add("hidden");
  $("config").classList.add("hidden");
}

function menu(){
  $("produtos").classList.add("hidden");
  $("formProduto").classList.add("hidden");
  $("pedidos").classList.add("hidden");
  $("config").classList.add("hidden");
  $("painel").classList.remove("hidden");
}


/* ==============================
   LOGIN
============================== */

async function login(){

  const email=$("email").value.trim();
  const password=$("senha").value;

  $("loginMsg").innerHTML="";

  if(!email||!password){
    $("loginMsg").innerHTML=
      '<div class="message">Preencha e-mail e senha.</div>';
    return;
  }

  const {data,error}=await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    $("loginMsg").innerHTML=
      '<div class="message">E-mail ou senha incorretos.</div>';
    console.error(error);
    return;
  }

  const {data:admin,error:adminError}=await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",data.user.id)
    .maybeSingle();

  if(adminError||!admin){

    await db.auth.signOut();

    $("loginMsg").innerHTML=
      '<div class="message">Esta conta não possui acesso administrativo.</div>';

    return;
  }

  $("login").classList.add("hidden");
  $("painel").classList.remove("hidden");
}

async function logout(){
  await db.auth.signOut();
  esconderTudo();
  $("login").classList.remove("hidden");
}


/* ==============================
   PRODUTOS
============================== */

async function produtos(){

  $("painel").classList.add("hidden");
  $("formProduto").classList.add("hidden");
  $("pedidos").classList.add("hidden");
  $("config").classList.add("hidden");
  $("produtos").classList.remove("hidden");

  carregarProdutos();
}

async function carregarProdutos(){

  const area=$("listaProdutos");
  area.innerHTML="Carregando produtos...";

  const {data,error}=await db
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    area.innerHTML=
      '<div class="message">Erro: '+esc(error.message)+'</div>';
    return;
  }

  if(!data?.length){
    area.innerHTML=
      '<div class="empty">Nenhum produto cadastrado.</div>';
    return;
  }

  area.innerHTML="";

  data.forEach(p=>{

    const div=document.createElement("div");
    div.className="item";

    div.innerHTML=`

      ${p.image?`
        <img src="${esc(p.image)}"
             alt="${esc(p.name)}"
             onerror="this.style.display='none'">
      `:""}

      <h3>${esc(p.name||"Sem nome")}</h3>

      <p>
        <b>Categoria:</b>
        ${esc(p.category||"-")}
      </p>

      <p>
        <b>Preço:</b>
        R$ ${dinheiro(p.price)}
      </p>

      <p>
        <b>Status:</b>
        ${p.active===false?"Inativo":"Ativo"}
      </p>

      ${p.description?
        `<p>${esc(p.description)}</p>`:""}

      <div class="actions">

        <button onclick='editarProduto(${JSON.stringify(p)})'>
          ✏️ Editar
        </button>

        <button class="btn-danger"
          onclick="excluirProduto(${p.id})">
          🗑️ Excluir
        </button>

      </div>
    `;

    area.appendChild(div);
  });
}


/* ==============================
   NOVO / EDITAR PRODUTO
============================== */

function novoProduto(){

  $("painel").classList.add("hidden");
  $("produtos").classList.add("hidden");
  $("pedidos").classList.add("hidden");
  $("config").classList.add("hidden");
  $("formProduto").classList.remove("hidden");

  $("formTitulo").innerText="➕ Novo produto";

  $("produtoId").value="";
  $("produtoNome").value="";
  $("produtoCategoria").value="";
  $("produtoPreco").value="";
  $("produtoDescricao").value="";
  $("produtoImagem").value="";
  $("produtoAtivo").checked=true;
  $("produtoMsg").innerHTML="";
}

function editarProduto(p){

  $("produtos").classList.add("hidden");
  $("formProduto").classList.remove("hidden");

  $("formTitulo").innerText="✏️ Editar produto";

  $("produtoId").value=p.id;
  $("produtoNome").value=p.name||"";
  $("produtoCategoria").value=p.category||"";
  $("produtoPreco").value=p.price||"";
  $("produtoDescricao").value=p.description||"";
  $("produtoImagem").value=p.image||"";
  $("produtoAtivo").checked=p.active!==false;
  $("produtoMsg").innerHTML="";
}

async function salvarProduto(){

  const id=$("produtoId").value;

  const produto={
    name:$("produtoNome").value.trim(),
    category:$("produtoCategoria").value.trim()||null,
    price:Number($("produtoPreco").value||0),
    description:$("produtoDescricao").value.trim()||null,
    image:$("produtoImagem").value.trim()||null,
    active:$("produtoAtivo").checked
  };

  if(!produto.name){
    $("produtoMsg").innerHTML=
      '<div class="message">Informe o nome.</div>';
    return;
  }

  if(produto.price<0){
    $("produtoMsg").innerHTML=
      '<div class="message">Preço inválido.</div>';
    return;
  }

  let result;

  if(id){

    result=await db
      .from("products")
      .update(produto)
      .eq("id",id);

  }else{

    result=await db
      .from("products")
      .insert(produto);

  }

  if(result.error){

    $("produtoMsg").innerHTML=
      '<div class="message">Erro: '+
      esc(result.error.message)+
      '</div>';

    return;
  }

  $("produtoMsg").innerHTML=
    '<div class="message">Produto salvo com sucesso! 🍰</div>';

  setTimeout(produtos,500);
}

async function excluirProduto(id){

  if(!confirm("Excluir este produto?"))return;

  const {error}=await db
    .from("products")
    .delete()
    .eq("id",id);

  if(error){
    alert("Erro: "+error.message);
    return;
  }

  carregarProdutos();
}


/* ==============================
   PEDIDOS
============================== */

async function pedidos(){

  $("painel").classList.add("hidden");
  $("produtos").classList.add("hidden");
  $("formProduto").classList.add("hidden");
  $("config").classList.add("hidden");
  $("pedidos").classList.remove("hidden");

  carregarPedidos();
}

async function carregarPedidos(){

  const area=$("listaPedidos");
  area.innerHTML="Carregando pedidos...";

  const {data,error}=await db
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    area.innerHTML=
      '<div class="message">Erro: '+esc(error.message)+'</div>';
    return;
  }

  if(!data?.length){
    area.innerHTML=
      '<div class="empty">📦 Nenhum pedido recebido.</div>';
    return;
  }

  area.innerHTML="";

  for(const pedido of data){

    const div=document.createElement("div");
    div.className="item";

    const {data:itens}=await db
      .from("order_items")
      .select("name,qty,price")
      .eq("order_id",pedido.id)
      .order("id");

    let itensHTML="";

    (itens||[]).forEach(item=>{
      itensHTML+=`
        <div class="order-item">
          <span>${item.qty}x ${esc(item.name)}</span>
          <b>R$ ${dinheiro(item.price*item.qty)}</b>
        </div>
      `;
    });

    div.innerHTML=`

      <div class="order-head">

        <div>
          <b>📦 Pedido #${pedido.id}</b>
          <small>
            ${pedido.created_at?
            new Date(pedido.created_at)
              .toLocaleString("pt-BR"):""}
          </small>
        </div>

        <span class="status">
          ${esc(pedido.status||"novo")}
        </span>

      </div>

      <div class="order-info">

        <p>👤 <b>Cliente:</b>
          ${esc(pedido.customer_name||"-")}
        </p>

        <p>📱 <b>WhatsApp:</b>
          ${esc(pedido.customer_phone||"-")}
        </p>

        <p>📧 <b>E-mail:</b>
          ${esc(pedido.customer_email||"-")}
        </p>

        <p>📅 <b>Data:</b>
          ${esc(pedido.scheduled_date||pedido.order_date||"-")}
        </p>

        <p>⏰ <b>Horário:</b>
          ${esc(pedido.scheduled_time||pedido.order_time||"-")}
        </p>

        <p>📦 <b>Recebimento:</b>
          ${esc(pedido.delivery_type||pedido.type||"retirada")}
        </p>

        ${pedido.delivery_address?`
          <p>📍 <b>Endereço:</b>
          ${esc(pedido.delivery_address)}</p>
        `:""}

        <p>💳 <b>Pagamento:</b>
          ${esc(pedido.payment_method||"-")}
        </p>

        <p>💰 <b>Total:</b>
          R$ ${dinheiro(pedido.total)}
        </p>

        ${pedido.notes?`
          <p>📝 <b>Observações:</b>
          ${esc(pedido.notes)}</p>
        `:""}

      </div>

      <h3>🍰 Itens</h3>

      ${itensHTML||"<p>Nenhum item encontrado.</p>"}

      <label>Status</label>

      <select onchange="alterarStatus(${pedido.id},this.value)">

        ${[
          ["novo","Novo"],
          ["confirmado","Confirmado"],
          ["em_preparo","Em preparo"],
          ["pronto","Pronto"],
          ["entregue","Entregue"],
          ["cancelado","Cancelado"]
        ].map(x=>`
          <option value="${x[0]}"
            ${pedido.status===x[0]?"selected":""}>
            ${x[1]}
          </option>
        `).join("")}

      </select>

      <div class="actions">

        <button class="btn-success"
          onclick="alterarStatus(${pedido.id},'confirmado')">
          ✅ Confirmar
        </button>

        <button
          onclick="alterarStatus(${pedido.id},'em_preparo')">
          👩‍🍳 Em preparo
        </button>

        <button
          onclick="alterarStatus(${pedido.id},'pronto')">
          🎂 Pronto
        </button>

        <button
          onclick="alterarStatus(${pedido.id},'entregue')">
          📦 Entregue
        </button>

      </div>

      <button class="btn-danger"
        onclick="alterarStatus(${pedido.id},'cancelado')">
        ❌ Cancelar pedido
      </button>
    `;

    area.appendChild(div);
  }
}

async function alterarStatus(id,status){

  const {error}=await db
    .from("orders")
    .update({status})
    .eq("id",id);

  if(error){
    alert("Erro: "+error.message);
    return;
  }

  carregarPedidos();
}


/* ==============================
   CONFIGURAÇÕES
============================== */

async function configuracoes(){

  $("painel").classList.add("hidden");
  $("produtos").classList.add("hidden");
  $("formProduto").classList.add("hidden");
  $("pedidos").classList.add("hidden");
  $("config").classList.remove("hidden");

  carregarConfig();
}

async function carregarConfig(){

  const {data,error}=await db
    .from("store_settings")
    .select("*")
    .limit(1)
    .maybeSingle();

  if(error){
    $("configMsg").innerHTML=
      '<div class="message">Erro: '+esc(error.message)+'</div>';
    return;
  }

  if(!data)return;

  $("cfgNome").value=data.store_name||"";
  $("cfgDescricao").value=data.description||"";
  $("cfgTelefone").value=data.phone||"";
  $("cfgWhatsapp").value=data.whatsapp||"";
  $("cfgPix").value=data.pix_key||"";
  $("cfgTaxa").value=data.delivery_fee||0;
  $("cfgHorario").value=data.opening_hours||"";
  $("cfgEndereco").value=data.address||"";
  $("cfgInstagram").value=data.instagram||"";
}

async function salvarConfig(){

  const config={
    store_name:$("cfgNome").value.trim(),
    description:$("cfgDescricao").value.trim(),
    phone:$("cfgTelefone").value.trim(),
    whatsapp:$("cfgWhatsapp").value.trim(),
    pix_key:$("cfgPix").value.trim(),
    delivery_fee:Number($("cfgTaxa").value||0),
    opening_hours:$("cfgHorario").value.trim(),
    address:$("cfgEndereco").value.trim(),
    instagram:$("cfgInstagram").value.trim(),
    updated_at:new Date().toISOString()
  };

  const {data:existente}=await db
    .from("store_settings")
    .select("id")
    .limit(1)
    .maybeSingle();

  let result;

  if(existente){

    result=await db
      .from("store_settings")
      .update(config)
      .eq("id",existente.id);

  }else{

    result=await db
      .from("store_settings")
      .insert(config);

  }

  if(result.error){

    $("configMsg").innerHTML=
      '<div class="message">Erro: '+
      esc(result.error.message)+
      '</div>';

    return;
  }

  $("configMsg").innerHTML=
    '<div class="message">Configurações salvas! ⚙️</div>';
}


/* ==============================
   VERIFICAR SESSÃO
============================== */

(async function(){

  const {data}=await db.auth.getSession();

  if(data.session){

    const {data:admin}=await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id",data.session.user.id)
      .maybeSingle();

    if(admin){

      $("login").classList.add("hidden");
      $("painel").classList.remove("hidden");

    }
  }

})();

</script>

</body>
</html>
