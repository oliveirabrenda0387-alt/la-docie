<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Lá Dociê</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf7;
      color: #4b281d;
    }

    header {
      background: #4b281d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .85;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #4b281d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .menu button {
      margin: 0;
      min-height: 100px;
    }

    .logout,
    .danger {
      background: #9b3d3d;
    }

    .secondary {
      background: #8b6b5c;
    }

    .success {
      background: #587b55;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #fff1eb;
    }

    .welcome {
      text-align: center;
    }

    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topo button {
      width: auto;
      margin: 0;
    }

    .produto,
    .pedido {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
      background: #fffaf7;
    }

    .produto img {
      width: 100%;
      max-height: 230px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .acoes button {
      margin-top: 8px;
    }

    .status {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 20px;
      background: #eadbd3;
      margin: 5px 0;
      font-size: 13px;
    }

    .pedido-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .pedido-item:last-child {
      border-bottom: 0;
    }

    .pedido-vazio,
    .pedido-erro,
    .vazio {
      text-align: center;
      padding: 25px 10px;
      color: #777;
    }

    .pedido-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .pedido-topo h3 {
      margin: 0;
    }

    .pedido-data {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .pedido-info {
      margin-top: 15px;
    }

    .pedido-info p {
      margin: 8px 0;
      line-height: 1.4;
    }

    .pedido-produtos {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .pedido-produtos h4 {
      margin: 0 0 8px;
    }

    .pedido-total {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
      text-align: right;
    }

    .pedido-acoes {
      margin-top: 15px;
    }

    .pedido-acoes select {
      margin-top: 5px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .menu {
        grid-template-columns: 1fr 1fr;
      }

      .pedido-topo {
        flex-direction: column;
      }

      .acoes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍰 LÁ DOCIÊ</h1>
  <p>Painel Administrativo</p>
</header>

<div class="container">

  <!-- LOGIN -->

  <div id="loginArea" class="card">

    <h2>🔐 Entrar</h2>

    <p>Acesso exclusivo da administração.</p>

    <input
      type="email"
      id="email"
      placeholder="Seu e-mail"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Sua senha"
      autocomplete="current-password"
    >

    <button onclick="entrar()">
      Entrar no painel
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- PAINEL -->

  <div id="painel" class="hidden">

    <div class="card welcome">

      <h2>Olá! 👋</h2>

      <p>
        Bem-vinda ao painel da
        <strong>Lá Dociê</strong>.
      </p>

    </div>


    <!-- MENU -->

    <div id="menuArea" class="card">

      <h2>📋 Administração</h2>

      <div class="menu">

        <button onclick="abrirProdutos()">
          🍰<br>
          Produtos
        </button>

        <button onclick="abrirPedidos()">
          📦<br>
          Pedidos
        </button>

        <button onclick="abrirConfiguracoes()">
          ⚙️<br>
          Configurações
        </button>

        <button onclick="abrirCadastroProduto()">
          ➕<br>
          Novo produto
        </button>

      </div>

      <button class="logout" onclick="sair()">
        Sair
      </button>

    </div>


    <!-- PRODUTOS -->

    <div id="produtosArea" class="card hidden">

      <div class="topo">

        <h2>🍰 Produtos</h2>

        <button class="secondary" onclick="abrirMenu()">
          Voltar
        </button>

      </div>

      <button onclick="abrirCadastroProduto()">
        ➕ Cadastrar novo produto
      </button>

      <button class="secondary" onclick="carregarProdutos()">
        🔄 Atualizar produtos
      </button>

      <div id="listaProdutos">
        Carregando...
      </div>

    </div>


    <!-- CADASTRO PRODUTO -->

    <div id="cadastroArea" class="card hidden">

      <h2 id="tituloFormulario">
        ➕ Novo produto
      </h2>

      <input
        type="hidden"
        id="produtoId"
      >

      <label>Nome do produto</label>

      <input
        type="text"
        id="produtoNome"
        placeholder="Ex.: Mini bolo"
      >

      <label>Categoria</label>

      <input
        type="text"
        id="produtoCategoria"
        placeholder="Ex.: Bolos"
      >

      <label>Preço</label>

      <input
        type="number"
        id="produtoPreco"
        step="0.01"
        placeholder="Ex.: 89.90"
      >

      <label>Imagem</label>

      <input
        type="text"
        id="produtoImagem"
        placeholder="Cole o link da imagem"
      >

      <button onclick="salvarProduto()">
        💾 Salvar produto
      </button>

      <button class="secondary" onclick="abrirProdutos()">
        Voltar
      </button>

      <div id="produtoMessage"></div>

    </div>


    <!-- PEDIDOS -->

    <div id="pedidosArea" class="card hidden">

      <div class="topo">

        <h2>📦 Pedidos</h2>

        <button class="secondary" onclick="abrirMenu()">
          Voltar
        </button>

      </div>

      <button
        class="secondary"
        onclick="carregarPedidos()"
      >
        🔄 Atualizar pedidos
      </button>

      <div id="listaPedidos">
        Carregando pedidos...
      </div>

    </div>


    <!-- CONFIGURAÇÕES -->

    <div id="configArea" class="card hidden">

      <div class="topo">

        <h2>⚙️ Configurações</h2>

        <button class="secondary" onclick="abrirMenu()">
          Voltar
        </button>

      </div>

      <label>Nome da loja</label>

      <input
        id="configNome"
        type="text"
      >

      <label>Descrição</label>

      <textarea id="configDescricao"></textarea>

      <label>Telefone</label>

      <input
        id="configTelefone"
        type="text"
      >

      <label>WhatsApp</label>

      <input
        id="configWhatsapp"
        type="text"
      >

      <label>Chave Pix</label>

      <input
        id="configPix"
        type="text"
      >

      <label>Taxa de entrega</label>

      <input
        id="configTaxa"
        type="number"
        step="0.01"
      >

      <label>Horário de funcionamento</label>

      <textarea
        id="configHorario"
        placeholder="Ex.: Terça a sexta: 14h às 22h"
      ></textarea>

      <label>Endereço</label>

      <input
        id="configEndereco"
        type="text"
      >

      <label>Instagram</label>

      <input
        id="configInstagram"
        type="text"
        placeholder="@ladocie"
      >

      <button onclick="salvarConfiguracoes()">
        💾 Salvar configurações
      </button>

      <div id="configMessage"></div>

    </div>

  </div>

</div>


<script>

  /* =====================================
     SUPABASE
  ===================================== */

  const SUPABASE_URL =
    "https://lzihqkpscesurkfmcasb.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_okTsv4Dxh12-D-3a2x2gyg_H37xXvnG";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================
     LOGIN
  ===================================== */

  async function entrar() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const mensagem =
      document.getElementById("loginMessage");

    mensagem.innerHTML = "";

    if (!email || !password) {

      mensagem.innerHTML =
        '<div class="message">Preencha e-mail e senha.</div>';

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      mensagem.innerHTML =
        '<div class="message">E-mail ou senha incorretos.</div>';

      return;
    }


    const user = data.user;


    const { data: admin, error: adminError } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


    if (adminError || !admin) {

      await supabaseClient.auth.signOut();

      mensagem.innerHTML =
        '<div class="message">Esta conta não possui acesso administrativo.</div>';

      return;
    }


    document
      .getElementById("loginArea")
      .classList.add("hidden");


    document
      .getElementById("painel")
      .classList.remove("hidden");

  }


  /* =====================================
     SAIR
  ===================================== */

  async function sair() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("painel")
      .classList.add("hidden");

    document
      .getElementById("loginArea")
      .classList.remove("hidden");

  }


  /* =====================================
     NAVEGAÇÃO
  ===================================== */

  function esconderAreas() {

    document
      .getElementById("menuArea")
      .classList.add("hidden");

    document
      .getElementById("produtosArea")
      .classList.add("hidden");

    document
      .getElementById("cadastroArea")
      .classList.add("hidden");

    document
      .getElementById("pedidosArea")
      .classList.add("hidden");

    document
      .getElementById("configArea")
      .classList.add("hidden");

  }


  function abrirMenu() {

    esconderAreas();

    document
      .getElementById("menuArea")
      .classList.remove("hidden");

  }


  /* =====================================
     PRODUTOS
  ===================================== */

  async function abrirProdutos() {

    esconderAreas();

    document
      .getElementById("produtosArea")
      .classList.remove("hidden");

    await carregarProdutos();

  }


  function abrirCadastroProduto() {

    esconderAreas();

    document
      .getElementById("cadastroArea")
      .classList.remove("hidden");

    document
      .getElementById("tituloFormulario")
      .innerText = "➕ Novo produto";

    document
      .getElementById("produtoId")
      .value = "";

    document
      .getElementById("produtoNome")
      .value = "";

    document
      .getElementById("produtoCategoria")
      .value = "";

    document
      .getElementById("produtoPreco")
      .value = "";

    document
      .getElementById("produtoImagem")
      .value = "";

    document
      .getElementById("produtoMessage")
      .innerHTML = "";

  }


  async function carregarProdutos() {

    const lista =
      document.getElementById("listaProdutos");

    lista.innerHTML =
      "Carregando produtos...";


    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("name", {
          ascending: true
        });


    if (error) {

      console.error(error);

      lista.innerHTML =
        '<div class="message">Erro ao carregar produtos: ' +
        error.message +
        '</div>';

      return;
    }


    if (!data || data.length === 0) {

      lista.innerHTML =
        '<div class="vazio">Nenhum produto cadastrado.</div>';

      return;
    }


    lista.innerHTML = "";


    data.forEach(produto => {

      const div =
        document.createElement("div");

      div.className = "produto";


      if (
        produto.image_url ||
        produto.image
      ) {

        const img =
          document.createElement("img");

        img.src =
          produto.image_url ||
          produto.image;

        img.alt =
          produto.name ||
          "Produto";

        div.appendChild(img);

      }


      const titulo =
        document.createElement("h3");

      titulo.innerText =
        produto.name ||
        "Sem nome";

      div.appendChild(titulo);


      const categoria =
        document.createElement("p");

      categoria.innerHTML =
        "<strong>Categoria:</strong> " +
        (
          produto.category ||
          "Sem categoria"
        );

      div.appendChild(categoria);


      const preco =
        document.createElement("p");

      preco.innerHTML =
        "<strong>Preço:</strong> R$ " +
        Number(
          produto.price || 0
        )
        .toFixed(2)
        .replace(".", ",");

      div.appendChild(preco);


      const acoes =
        document.createElement("div");

      acoes.className =
        "acoes";


      const editar =
        document.createElement("button");

      editar.innerText =
        "✏️ Editar";

      editar.onclick =
        function() {
          editarProduto(produto);
        };


      const excluir =
        document.createElement("button");

      excluir.innerText =
        "🗑️ Excluir";

      excluir.className =
        "danger";

      excluir.onclick =
        function() {
          excluirProduto(produto.id);
        };


      acoes.appendChild(editar);
      acoes.appendChild(excluir);

      div.appendChild(acoes);

      lista.appendChild(div);

    });

  }


  async function salvarProduto() {

    const id =
      document
        .getElementById("produtoId")
        .value;

    const nome =
      document
        .getElementById("produtoNome")
        .value
        .trim();

    const categoria =
      document
        .getElementById("produtoCategoria")
        .value
        .trim();

    const preco =
      Number(
        document
          .getElementById("produtoPreco")
          .value || 0
      );

    const imagem =
      document
        .getElementById("produtoImagem")
        .value
        .trim();

    const mensagem =
      document.getElementById(
        "produtoMessage"
      );


    mensagem.innerHTML = "";


    if (!nome) {

      mensagem.innerHTML =
        '<div class="message">Digite o nome do produto.</div>';

      return;
    }


    const produto = {

      name: nome,

      category:
        categoria || null,

      price:
        preco,

      image:
        imagem || null

    };


    let resultado;


    if (id) {

      resultado =
        await supabaseClient
          .from("products")
          .update(produto)
          .eq("id", id);

    } else {

      resultado =
        await supabaseClient
          .from("products")
          .insert(produto);

    }


    if (resultado.error) {

      console.error(
        resultado.error
      );

      mensagem.innerHTML =
        '<div class="message">Erro ao salvar produto: ' +
        resultado.error.message +
        '</div>';

      return;
    }


    mensagem.innerHTML =
      '<div class="message">Produto salvo com sucesso! 🍰</div>';


    setTimeout(
      () => abrirProdutos(),
      700
    );

  }


  function editarProduto(produto) {

    esconderAreas();

    document
      .getElementById("cadastroArea")
      .classList.remove("hidden");


    document
      .getElementById("tituloFormulario")
      .innerText =
      "✏️ Editar produto";


    document
      .getElementById("produtoId")
      .value =
      produto.id || "";


    document
      .getElementById("produtoNome")
      .value =
      produto.name || "";


    document
      .getElementById("produtoCategoria")
      .value =
      produto.category || "";


    document
      .getElementById("produtoPreco")
      .value =
      produto.price || "";


    document
      .getElementById("produtoImagem")
      .value =
      produto.image_url ||
      produto.image ||
      "";

  }


  async function excluirProduto(id) {

    if (
      !confirm(
        "Tem certeza que deseja excluir este produto?"
      )
    ) {

      return;

    }


    const { error } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Não foi possível excluir: " +
        error.message
      );

      return;
    }


    alert(
      "Produto excluído com sucesso! 🍰"
    );


    await carregarProdutos();

  }


  /* =====================================
     PEDIDOS
  ===================================== */

  async function abrirPedidos() {

    esconderAreas();

    document
      .getElementById("pedidosArea")
      .classList.remove("hidden");

    await carregarPedidos();

  }


  async function carregarPedidos() {

    const lista =
      document.getElementById(
        "listaPedidos"
      );


    lista.innerHTML =
      "🔄 Carregando pedidos...";


    try {

      const {
        data: pedidos,
        error
      } =
        await supabaseClient
          .from("orders")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        throw error;

      }


      if (
        !pedidos ||
        pedidos.length === 0
      ) {

        lista.innerHTML = `
          <div class="pedido-vazio">
            📦<br><br>
            Nenhum pedido recebido ainda.
          </div>
        `;

        return;

      }


      lista.innerHTML = "";


      for (
        const pedido of pedidos
      ) {

        await criarCardPedido(
          pedido,
          lista
        );

      }


    } catch (erro) {

      console.error(
        "ERRO AO CARREGAR PEDIDOS:",
        erro
      );


      lista.innerHTML = `
        <div class="message">

          ❌ <strong>Erro ao carregar pedidos.</strong>

          <br><br>

          ${erro.message || erro}

        </div>
      `;

    }

  }


  async function criarCardPedido(
    pedido,
    lista
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "pedido";


    const dataPedido =
      pedido.created_at
        ? new Date(
            pedido.created_at
          ).toLocaleString(
            "pt-BR"
          )
        : "Data não informada";


    const tipo =
      pedido.delivery_type ||
      pedido.type ||
      "retirada";


    const status =
      pedido.status ||
      "novo";


    card.innerHTML = `

      <div class="pedido-topo">

        <div>

          <h3>
            📦 Pedido #${pedido.id}
          </h3>

          <div class="pedido-data">
            ${dataPedido}
          </div>

        </div>

        <span class="status">
          ${status}
        </span>

      </div>


      <div class="pedido-info">

        <p>
          👤
          <strong>Cliente:</strong>
          ${pedido.customer_name || "-"}
        </p>

        <p>
          📱
          <strong>Telefone:</strong>
          ${pedido.customer_phone || "-"}
        </p>

        <p>
          📧
          <strong>E-mail:</strong>
          ${pedido.customer_email || "-"}
        </p>

        <p>
          📅
          <strong>Data agendada:</strong>
          ${pedido.scheduled_date || "-"}
        </p>

        <p>
          ⏰
          <strong>Horário:</strong>
          ${pedido.scheduled_time || "-"}
        </p>

        <p>
          📦
          <strong>Recebimento:</strong>
          ${tipo}
        </p>

        ${
          pedido.delivery_address
          ?
          `
          <p>
            📍
            <strong>Endereço:</strong>
            ${pedido.delivery_address}
          </p>
          `
          :
          ""
        }

        <p>
          💳
          <strong>Pagamento:</strong>
          ${pedido.payment_method || "-"}
        </p>

        <p>
          💰
          <strong>Total:</strong>
          R$ ${Number(
            pedido.total || 0
          )
          .toFixed(2)
          .replace(".", ",")}
        </p>

        ${
          pedido.notes
          ?
          `
          <p>
            📝
            <strong>Observações:</strong>
            ${pedido.notes}
          </p>
          `
          :
          ""
        }

      </div>


      <div class="pedido-produtos">

        <h4>
          🍰 Produtos do pedido
        </h4>

        <div id="itens-${pedido.id}">
          Carregando produtos...
        </div>

      </div>


      <div class="pedido-total">

        Total:
        R$ ${Number(
          pedido.total || 0
        )
        .toFixed(2)
        .replace(".", ",")}

      </div>


      <div class="pedido-acoes">

        <label>
          Alterar status
        </label>

        <select
          onchange="
            alterarStatusPedido(
              ${pedido.id},
              this.value
            )
          "
        >

          <option
            value="novo"
            ${status === "novo" ? "selected" : ""}
          >
            Novo
          </option>

          <option
            value="confirmado"
            ${status === "confirmado" ? "selected" : ""}
          >
            Confirmado
          </option>

          <option
            value="em_preparo"
            ${status === "em_preparo" ? "selected" : ""}
          >
            Em preparo
          </option>

          <option
            value="pronto"
            ${status === "pronto" ? "selected" : ""}
          >
            Pronto
          </option>

          <option
            value="entregue"
            ${status === "entregue" ? "selected" : ""}
          >
            Entregue
          </option>

          <option
            value="cancelado"
            ${status === "cancelado" ? "selected" : ""}
          >
            Cancelado
          </option>

        </select>


        <button
          class="danger"
          onclick="
            cancelarPedido(${pedido.id})
          "
        >
          ❌ Cancelar pedido
        </button>

      </div>

    `;


    lista.appendChild(
      card
    );


    await carregarItensPedido(
      pedido.id
    );

  }


  /* =====================================
     ITENS DO PEDIDO
  ===================================== */

  async function carregarItensPedido(
    orderId
  ) {

    const area =
      document.getElementById(
        "itens-" + orderId
      );


    if (!area) {

      return;

    }


    try {

      const {
        data: itens,
        error
      } =
        await supabaseClient
          .from("order_items")
          .select("*")
          .eq(
            "order_id",
            orderId
          )
          .order(
            "id",
            {
              ascending: true
            }
          );


      if (error) {

        throw error;

      }


      if (
        !itens ||
        itens.length === 0
      ) {

        area.innerHTML =
          "<p>Nenhum produto encontrado neste pedido.</p>";

        return;

      }


      area.innerHTML = "";


      itens.forEach(
        item => {

          const linha =
            document.createElement(
              "div"
            );


          linha.className =
            "pedido-item";


          const quantidade =
            Number(
              item.qty || 1
            );


          const preco =
            Number(
              item.price || 0
            );


          linha.innerHTML = `

            <span>
              ${quantidade}x
              ${item.name || "Produto"}
            </span>

            <strong>
              R$ ${(
                preco *
                quantidade
              )
              .toFixed(2)
              .replace(".", ",")}
            </strong>

          `;


          area.appendChild(
            linha
          );

        }
      );


    } catch (erro) {

      console.error(
        "Erro nos itens:",
        erro
      );


      area.innerHTML = `
        <p>
          ❌ Não foi possível carregar
          os produtos deste pedido.
        </p>
      `;

    }

  }


  /* =====================================
     ALTERAR STATUS
  ===================================== */

  async function alterarStatusPedido(
    id,
    status
  ) {

    try {

      const {
        error
      } =
        await supabaseClient
          .from("orders")
          .update({
            status: status
          })
          .eq(
            "id",
            id
          );


      if (error) {

        throw error;

      }


      await carregarPedidos();


    } catch (erro) {

      console.error(
        erro
      );


      alert(
        "Erro ao alterar status: " +
        erro.message
      );

    }

  }


  /* =====================================
     CANCELAR PEDIDO
  ===================================== */

  async function cancelarPedido(
    id
  ) {

    if (
      !confirm(
        "Deseja realmente cancelar este pedido?"
      )
    ) {

      return;

    }


    await alterarStatusPedido(
      id,
      "cancelado"
    );

  }


  /* =====================================
     CONFIGURAÇÕES
  ===================================== */

  async function abrirConfiguracoes() {

    esconderAreas();

    document
      .getElementById("configArea")
      .classList.remove("hidden");


    await carregarConfiguracoes();

  }


  async function carregarConfiguracoes() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("store_settings")
        .select("*")
        .limit(1)
        .maybeSingle();


    if (error) {

      document
        .getElementById(
          "configMessage"
        )
        .innerHTML =
        '<div class="message">Erro ao carregar configurações: ' +
        error.message +
        '</div>';

      return;

    }


    if (!data) {

      return;

    }


    document
      .getElementById(
        "configNome"
      )
      .value =
      data.store_name || "";


    document
      .getElementById(
        "configDescricao"
      )
      .value =
      data.description || "";


    document
      .getElementById(
        "configTelefone"
      )
      .value =
      data.phone || "";


    document
      .getElementById(
        "configWhatsapp"
      )
      .value =
      data.whatsapp || "";


    document
      .getElementById(
        "configPix"
      )
      .value =
      data.pix_key || "";


    document
      .getElementById(
        "configTaxa"
      )
      .value =
      data.delivery_fee || 0;


    document
      .getElementById(
        "configHorario"
      )
      .value =
      data.opening_hours || "";


    document
      .getElementById(
        "configEndereco"
      )
      .value =
      data.address || "";


    document
      .getElementById(
        "configInstagram"
      )
      .value =
      data.instagram || "";

  }


  async function salvarConfiguracoes() {

    const mensagem =
      document.getElementById(
        "configMessage"
      );


    mensagem.innerHTML =
      "Salvando...";


    const {
      data: existente
    } =
      await supabaseClient
        .from("store_settings")
        .select("id")
        .limit(1)
        .maybeSingle();


    const configuracao = {

      store_name:
        document
          .getElementById(
            "configNome"
          )
          .value
          .trim(),

      description:
        document
          .getElementById(
            "configDescricao"
          )
          .value
          .trim(),

      phone:
        document
          .getElementById(
            "configTelefone"
          )
          .value
          .trim(),

      whatsapp:
        document
          .getElementById(
            "configWhatsapp"
          )
          .value
          .trim(),

      pix_key:
        document
          .getElementById(
            "configPix"
          )
          .value
          .trim(),

      delivery_fee:
        Number(
          document
            .getElementById(
              "configTaxa"
            )
            .value || 0
        ),

      opening_hours:
        document
          .getElementById(
            "configHorario"
          )
          .value
          .trim(),

      address:
        document
          .getElementById(
            "configEndereco"
          )
          .value
          .trim(),

      instagram:
        document
          .getElementById(
            "configInstagram"
          )
          .value
          .trim(),

      updated_at:
        new Date().toISOString()

    };


    let resultado;


    if (existente) {

      resultado =
        await supabaseClient
          .from("store_settings")
          .update(
            configuracao
          )
          .eq(
            "id",
            existente.id
          );

    } else {

      resultado =
        await supabaseClient
          .from("store_settings")
          .insert(
            configuracao
          );

    }


    if (resultado.error) {

      mensagem.innerHTML =
        '<div class="message">Erro ao salvar: ' +
        resultado.error.message +
        '</div>';

      return;

    }


    mensagem.innerHTML =
      '<div class="message">Configurações salvas com sucesso! ⚙️</div>';

  }


  /* =====================================
     INICIALIZAÇÃO
  ===================================== */

  atualizarTelaInicial();


  async function atualizarTelaInicial() {

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (
      data &&
      data.session
    ) {

      const user =
        data.session.user;


      const {
        data: admin
      } =
        await supabaseClient
          .from("admin_users")
          .select("user_id")
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();


      if (admin) {

        document
          .getElementById(
            "loginArea"
          )
          .classList.add(
            "hidden"
          );


        document
          .getElementById(
            "painel"
          )
          .classList.remove(
            "hidden"
          );

      }

    }

  }

</script>
