/* =========================================================
   UTILIDADES
========================================================= */

function escapeHTML(valor) {

  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function dinheiro(valor) {

  return Number(valor || 0)
    .toFixed(2)
    .replace(".", ",");
}


function mostrarMensagem(mensagem, tipo = "success") {

  const box =
    document.getElementById("globalNotice");

  if (!box) return;

  box.textContent = mensagem;

  box.className =
    "notice show " + tipo;

  setTimeout(() => {

    box.classList.remove("show");

  }, 5000);
}


function mostrarLoginErro(mensagem) {

  const box =
    document.getElementById("loginError");

  if (!box) return;

  box.textContent = mensagem;

  box.className =
    "notice show error";
}


/* =========================================================
   LOGIN
========================================================= */

async function entrar() {

  const email =
    document
      .getElementById("loginEmail")
      ?.value
      .trim();

  const senha =
    document
      .getElementById("loginPassword")
      ?.value;

  if (!email || !senha) {

    mostrarLoginErro(
      "Digite seu e-mail e sua senha."
    );

    return;
  }

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: senha
      });

    if (error) throw error;

    if (!data?.session) {

      throw new Error(
        "Não foi possível iniciar a sessão."
      );
    }

    await abrirAdmin();

  } catch (error) {

    console.error(
      "Erro no login:",
      error
    );

    mostrarLoginErro(
      error.message ||
      "E-mail ou senha incorretos."
    );
  }
}

    login.classList.add("hidden");

  if (admin) {
    admin.classList.remove("hidden");

}


/* =========================================================

========================================================= */

async function sair() {

  try {

    await supabaseClient.auth.signOut();

  } catch (error) {

    console.error(
      "Erro ao sair:",
      error
    );
  }

  if (realtimeChannel) {

    try {

      await supabaseClient
        .removeChannel(realtimeChannel);

    } catch (error) {

      console.error(error);
    }

    realtimeChannel = null;
  }

  document
    .getElementById("adminScreen")
    ?.classList
    .add("hidden");

  document
    .getElementById("loginScreen")
    ?.classList
    .remove("hidden");
}

  document
    .querySelectorAll(".panel")

/* =========================================================

async function carregarProdutos() {

  const area =
    document.getElementById("productsList");

  const tbody =
    document.getElementById("stockTable");

  if (area) {

    area.innerHTML =
      `<div class="small">
        Carregando produtos...
      </div>`;
  }

  if (tbody) {

    tbody.innerHTML =
      `<tr>
        <td colspan="5">
          Carregando estoque...
        </td>
      </tr>`;
  }

  try {

    console.log(
      "Carregando produtos..."
    );

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(
        "Erro Supabase produtos:",

      );

      throw error;
    }

    produtos =
      Array.isArray(data)
        ? data

    renderizarEstoque();

      "ERRO AO CARREGAR PRODUTOS:",
      error

          ❌ Não foi possível carregar os produtos.

    if (tbody) {

      tbody.innerHTML =
        `<tr>
          <td colspan="5">
            ❌ Erro ao carregar estoque.
          </td>

    mostrarMensagem(
      "Erro ao carregar produtos.",

    );

}


/* =========================================================

========================================================= */

function abrirEditorProduto(id = null) {

  const modal =

  modal.classList.add("show");

      "produtoId"

    document.getElementById(
      "produtoNome"
    ).value =
      produto.name || "";

    document.getElementById(
      "produtoCategoria"
    ).value =
      produto.category || "bolos";

    document.getElementById(
      "produtoPreco"
    ).value =
      produto.price ?? "";

    document.getElementById(
      "produtoDescricao"
    ).value =
      produto.description || "";

    document.getElementById(
      "produtoImagem"
    ).value =
      produto.image || "";

    document.getElementById(
      "produtoEstoque"
    ).value =
      produto.stock ?? 0;

    document.getElementById(
      "produtoEstoqueMinimo"
    ).value =
      produto.min_stock ?? 5;

    document.getElementById(
      "produtoAtivo"
    ).checked =
      produto.active !== false;

  } else {

    document.getElementById(
      "productModalTitle"
    ).textContent =
      "Novo produto";

    document.getElementById(
      "produtoId"
    ).value = "";

    document.getElementById(
      "produtoNome"
    ).value = "";

    document.getElementById(
      "produtoCategoria"
    ).value = "bolos";

    document.getElementById(
      "produtoPreco"
    ).value = "";

    document.getElementById(
      "produtoDescricao"
    ).value = "";

    document.getElementById(
      "produtoImagem"
    ).value = "";

    document.getElementById(
      "produtoEstoque"
    ).value = 0;

    document.getElementById(
      "produtoEstoqueMinimo"
    ).value = 5;

    document.getElementById(
      "produtoAtivo"
    ).checked = true;
  }
}


function fecharEditorProduto() {

  document
    .getElementById("productModal")
    ?.classList

}


/* =========================================================
   SALVAR PRODUTO
========================================================= */

async function salvarProduto() {

  const id =
    document
      .getElementById("produtoId")
      ?.value;

  const dados = {

    name:
      document
        .getElementById("produtoNome")
        ?.value
        .trim(),

    category:
      document
        .getElementById("produtoCategoria")
        ?.value,

    price:
      Number(
        document
          .getElementById("produtoPreco")
          ?.value || 0
      ),

    description:
      document
        .getElementById("produtoDescricao")
        ?.value
        .trim() || null,

    image:
      document
        .getElementById("produtoImagem")
        ?.value
        .trim() || null,

    active:
      document
        .getElementById("produtoAtivo")
        ?.checked,

    stock:
      Number(
        document
          .getElementById("produtoEstoque")
          ?.value || 0
      ),

    min_stock:
      Number(
        document
          .getElementById("produtoEstoqueMinimo")
          ?.value || 0
      )
  };

  if (!dados.name) {

    mostrarMensagem(
      "Digite o nome do produto.",
      "error"
    );

    return;
  }

  try {

    if (id) {

      const { data, error } =
        await supabaseClient
          .from("products")
          .update(dados)
          .eq("id", Number(id))
          .select()
          .single();

      if (error) throw error;

      const indice =
        produtos.findIndex(
          p =>
            Number(p.id) ===
            Number(id)
        );

      if (indice !== -1) {

        produtos[indice] = data;
      }

      mostrarMensagem(
        "Produto atualizado com sucesso!"
      );

    } else {

      const { data, error } =
        await supabaseClient
          .from("products")
          .insert([dados])
          .select()
          .single();

      if (error) throw error;

      produtos.unshift(data);

      mostrarMensagem(
        "Produto criado com sucesso!"
      );
    }

    renderizarProdutos();

    renderizarEstoque();

    fecharEditorProduto();

  } catch (error) {

    console.error(
      "Erro ao salvar produto:",
      error
    );

    mostrarMensagem(
      "Não foi possível salvar o produto: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   RENDERIZAR PRODUTOS
========================================================= */

  const area =

  if (!area) return;

  if (!produtos.length) {

    area.innerHTML =

  area.innerHTML = "";

  produtos.forEach(produto => {

      document.createElement("div");

    const imagem =
      produto.image
        ? `<img
            src="${escapeHTML(produto.image)}"
            alt="${escapeHTML(produto.name)}"
          >`
        : "🍰";

    const estoque =
      Number(produto.stock ?? 0);

    card.innerHTML = `

      <div class="product-image">
        ${imagem}
      </div>

      <div class="product-name">
        ${escapeHTML(produto.name)}
      </div>

      <div class="small">
        ${escapeHTML(
          produto.category ||
          "Produto"
        )}
      </div>

      <div class="product-price">
        R$ ${dinheiro(produto.price)}
      </div>

      <div class="small">
        Estoque:
        <strong>${estoque}</strong>
      </div>

      <div class="product-actions">

        <button
          class="btn btn-primary"
          onclick="abrirEditorProduto(${produto.id})">
          ✏️ Editar
        </button>

        <button
          class="btn ${
            produto.active
              ? "btn-danger"
              : "btn-success"
          }"
          onclick="alternarProduto(${produto.id})">

          ${
            produto.active
              ? "Desativar"
              : "Ativar"
          }

        </button>

      </div>
    `;

    area.appendChild(card);
  });
}


/* =========================================================
   ATIVAR / DESATIVAR PRODUTO
========================================================= */

async function alternarProduto(id) {

  const produto =
    produtos.find(
      p =>
        Number(p.id) ===
        Number(id)
    );

  if (!produto) return;

  try {

    const { data, error } =
      await supabaseClient
        .from("products")
        .update({
          active: !produto.active
        })
        .eq("id", Number(id))
        .select()
        .single();

    if (error) throw error;

    const indice =
      produtos.findIndex(
        p =>
          Number(p.id) ===
          Number(id)
      );

    if (indice !== -1) {

      produtos[indice] = data;
    }

    renderizarProdutos();

    mostrarMensagem(
      data.active
        ? "Produto ativado."
        : "Produto retirado do site."
    );

  } catch (error) {

    console.error(error);

    mostrarMensagem(
      error.message,
      "error"
    );
  }
}


/* =========================================================
   ESTOQUE
========================================================= */

function renderizarEstoque() {

  const tbody =
    document.getElementById(
      "stockTable"
    );

  if (!tbody) return;

  if (!produtos.length) {

    tbody.innerHTML =
      `<tr>
        <td colspan="5">
          Nenhum produto cadastrado.
        </td>
      </tr>`;

    return;
  }

  let baixos = 0;
  let esgotados = 0;

  tbody.innerHTML = "";

  produtos.forEach(produto => {

    const estoque =
      Number(produto.stock ?? 0);

    const minimo =
      Number(produto.min_stock ?? 5);

    let status;
    let classe;

    if (estoque <= 0) {

      status = "ESGOTADO";
      classe = "stock-out";

      esgotados++;

    } else if (estoque <= minimo) {

      status = "ESTOQUE BAIXO";
      classe = "stock-low";

      baixos++;

    } else {

      status = "NORMAL";
      classe = "stock-ok";
    }

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        <strong>
          ${escapeHTML(produto.name)}
        </strong>
      </td>

      <td>
        <span class="stock-number ${classe}">
          ${estoque}
        </span>
      </td>

      <td>
        ${minimo}
      </td>

      <td>
        <strong class="${classe}">
          ${status}
        </strong>
      </td>

      <td>

        <button
          class="btn btn-light"
          onclick="abrirEditorProduto(${produto.id})">
          Ajustar
        </button>

      </td>
    `;

    tbody.appendChild(tr);
  });

  const totalProdutos =
    document.getElementById(
      "stockTotalProdutos"
    );

  const estoqueBaixo =
    document.getElementById(
      "stockBaixo"
    );

  const estoqueEsgotado =
    document.getElementById(
      "stockEsgotado"
    );

  if (totalProdutos) {

    totalProdutos.textContent =
      produtos.length;
  }

  if (estoqueBaixo) {

    estoqueBaixo.textContent =
      baixos;
  }

  if (estoqueEsgotado) {

    estoqueEsgotado.textContent =
      esgotados;
  }

  const statEstoque =
    document.getElementById(
      "statEstoque"
    );

  if (statEstoque) {

    statEstoque.textContent =
      baixos + esgotados;
  }

  renderizarDashboardEstoque();
}


/* =========================================================
   DASHBOARD ESTOQUE
========================================================= */

function renderizarDashboardEstoque() {

  const area =
    document.getElementById(
      "dashboardEstoque"
    );

  if (!area) return;

  const problemas =
    produtos
      .filter(p => {

        const estoque =
          Number(p.stock ?? 0);

        const minimo =
          Number(p.min_stock ?? 5);

        return estoque <= minimo;

      })
      .slice(0, 5);

  if (!problemas.length) {

    area.innerHTML =
      `<div class="small">
        ✅ Nenhum produto precisa de reposição.
      </div>`;

    return;
  }

  area.innerHTML =
    problemas
      .map(p => {

        const estoque =
          Number(p.stock ?? 0);

        return `

          <div style="
            display:flex;
            justify-content:space-between;
            padding:10px 0;
            border-bottom:1px solid #eee5e0;
          ">

            <strong>
              ${escapeHTML(p.name)}
            </strong>

            <span class="${
              estoque <= 0
                ? "stock-out"
                : "stock-low"
            }">

              ${
                estoque <= 0
                  ? "Esgotado"
                  : estoque + " un."
              }

            </span>

          </div>
        `;
      })
      .join("");
}

/* =========================================================
   FILTRO PEDIDOS
========================================================= */

function filtrarPedidos(
  status,
  botao
) {

  filtroAtual =
    status;

  document
    .querySelectorAll(".order-tab")
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );
    });

  if (botao) {

    botao.classList.add(
      "active"
    );
  }

  renderizarPedidos();
}


/* =========================================================
   RENDERIZAR PEDIDOS
========================================================= */

function renderizarPedidos() {

  const area =
    document.getElementById(
      "ordersList"
    );

  if (!area) return;

  let lista =
    [...pedidos];

  if (
    filtroAtual !== "todos"
  ) {

    lista =
      lista.filter(p =>
        (p.status ||
          "pendente") ===
        filtroAtual
      );
  }

  if (!lista.length) {

    area.innerHTML =
      `<div class="small">
        Nenhum pedido encontrado.
      </div>`;

    return;
  }

  area.innerHTML =
    lista
      .map(p => {

        const status =
          p.status ||
          "pendente";

        const cliente =
          p.customer_name ||
          p.name ||
          p.customer ||
          "Cliente";

        const data =
          p.created_at
            ? new Date(
                p.created_at
              ).toLocaleString(
                "pt-BR",
                {
                  dateStyle:
                    "short",
                  timeStyle:
                    "short"
                }
              )
            : "";

        return `

          <div
            class="order-row"
            onclick="abrirDetalhePedidoPorId(${Number(p.id)})">

            <div>

              <div class="order-number">
                Pedido #${escapeHTML(p.id)}
              </div>

              <div class="order-client">
                ${escapeHTML(cliente)}
              </div>

              <div class="order-meta">

                <span
                  class="tag tag-${escapeHTML(status)}">

                  ${escapeHTML(status)}

                </span>

              </div>

            </div>

            <div>

              <div class="order-total">
                R$ ${dinheiro(p.total)}
              </div>

              <div class="order-time">
                ${escapeHTML(data)}
              </div>

            </div>

          </div>
        `;
      })
      .join("");
}

/* =========================================================
   ITENS DO PEDIDO
========================================================= */

async function carregarItensDoPedido(
  orderId
) {

  const tbody =
    document.getElementById(
      "pedidoItens"
    );

  const aviso =
    document.getElementById(
      "pedidoItensAviso"
    );

  if (!tbody) return;

  tbody.innerHTML =
    `<tr>
      <td colspan="4"
          style="text-align:center">
        Carregando produtos...
      </td>
    </tr>`;

  if (aviso) {

    aviso.style.display =
      "none";

    aviso.textContent =
      "";
  }

  itensPedidoAtual = [];

  try {

    const { data, error } =
      await supabaseClient
        .from("order_items")
        .select("*")
        .eq(
          "order_id",
          Number(orderId)
        )
        .order("id", {
          ascending: true
        });

    if (error) throw error;

    itensPedidoAtual =
      Array.isArray(data)
        ? data
        : [];

    renderizarItensPedido();

  } catch (error) {

    console.error(
      "Erro ao carregar itens:",
      error
    );

    tbody.innerHTML =
      `<tr>
        <td colspan="4">
          ❌ Não foi possível carregar
          os produtos deste pedido.
        </td>
      </tr>`;

    if (aviso) {

      aviso.textContent =
        "Erro ao carregar os produtos: " +
        error.message;

      aviso.style.display =
        "block";
    }
  }
}


/* =========================================================
   RENDERIZAR ITENS
========================================================= */

function renderizarItensPedido() {

  const tbody =
    document.getElementById(
      "pedidoItens"
    );

  if (!tbody) return;

  if (!itensPedidoAtual.length) {

    tbody.innerHTML =
      `<tr>
        <td
          colspan="4"
          style="text-align:center">

          Nenhum produto encontrado
          neste pedido.

        </td>
      </tr>`;

    document.getElementById(
      "pedidoSubtotal"
    ).textContent =
      "R$ 0,00";

    return;
  }

  let subtotal = 0;

  tbody.innerHTML =
    itensPedidoAtual
      .map(item => {

        const quantidade =
          Number(
            item.qty || 0
          );

        const preco =
          Number(
            item.price || 0
          );

        const totalItem =
          quantidade *
          preco;

        subtotal +=
          totalItem;

        return `

          <tr>

            <td>

              <strong>
                ${escapeHTML(
                  item.name ||
                  "Produto"
                )}
              </strong>

            </td>

            <td>
              ${quantidade}
            </td>

            <td>
              R$ ${dinheiro(preco)}
            </td>

            <td>

              <strong>
                R$ ${dinheiro(totalItem)}
              </strong>

            </td>

          </tr>
        `;
      })
      .join("");

  document.getElementById(
    "pedidoSubtotal"
  ).textContent =
    "R$ " +
    dinheiro(subtotal);

  if (
    pedidoAtual &&
    (
      pedidoAtual.total === null ||
      pedidoAtual.total === undefined
    )
  ) {

    document.getElementById(
      "pedidoTotal"
    ).textContent =
      "R$ " +
      dinheiro(subtotal);
  }
}

/* =========================================================
   ALTERAR STATUS
========================================================= */

async function alterarStatusPedidoAtual(
  novoStatus
) {

  if (!pedidoAtual) return;

  try {

    const { data, error } =
      await supabaseClient
        .from("orders")
        .update({
          status:
            novoStatus
        })
        .eq(
          "id",
          Number(
            pedidoAtual.id
          )
        )
        .select()
        .single();

    if (error) throw error;

    pedidoAtual =
      data;

    const indice =
      pedidos.findIndex(
        p =>
          Number(p.id) ===
          Number(data.id)
      );

    if (indice !== -1) {

      pedidos[indice] =
        data;
    }

    preencherDetalhePedido(
      data
    );

    renderizarPedidos();

    atualizarDashboard();

    mostrarMensagem(
      "Status do pedido atualizado!"
    );

  } catch (error) {

    console.error(error);

    mostrarMensagem(
      "Não foi possível alterar o status: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   PAGAMENTO EM DINHEIRO
========================================================= */

function atualizarPagamentoDinheiro(
  pedido
) {

  const forma =
    String(
      pedido.payment_method ||
      pedido.payment_type ||
      pedido.payment ||
      ""
    ).toLowerCase();

  const cashBox =
    document.getElementById(
      "cashBox"
    );

  if (!cashBox) return;

  const dinheiroCliente =
    Number(
      pedido.cash_received ??
      pedido.money_received ??
      pedido.amount_received ??
      0
    );

  const total =
    Number(
      pedido.total || 0
    );

  const eDinheiro =
    forma.includes(
      "dinheiro"
    ) ||
    forma.includes(
      "cash"
    );

  if (!eDinheiro) {

    cashBox.classList.add(
      "hidden"
    );

    return;
  }

  cashBox.classList.remove(
    "hidden"
  );

  document.getElementById(
    "dinheiroCliente"
  ).textContent =
    "R$ " +
    dinheiro(
      dinheiroCliente
    );

  const precisa =
    dinheiroCliente > 0 &&
    dinheiroCliente < total;

  document.getElementById(
    "precisaTroco"
  ).textContent =

    precisa
      ? "Não"
      : dinheiroCliente >= total
        ? "Sim"
        : "-";

  const troco =
    dinheiroCliente -
    total;

  document.getElementById(
    "valorTroco"
  ).textContent =
    "R$ " +
    dinheiro(
      Math.max(
        0,
        troco
      )
    );
}


/* =========================================================
   WHATSAPP
========================================================= */

function chamarWhatsApp() {

  if (!pedidoAtual) return;

  const telefone =
    pedidoAtual.customer_phone ||
    pedidoAtual.phone ||
    pedidoAtual.whatsapp ||
    pedidoAtual.customer_whatsapp ||
    "";

  if (!telefone) {

    mostrarMensagem(
      "Este pedido não possui WhatsApp cadastrado.",
      "error"
    );

    return;
  }

  const numero =
    String(
      telefone
    ).replace(
      /\D/g,
      ""
    );

  const cliente =
    pedidoAtual.customer_name ||
    pedidoAtual.name ||
    "cliente";

  const mensagem =
    `Olá, ${cliente}! Aqui é da Lá Dociê. Estou entrando em contato sobre o seu pedido #${pedidoAtual.id}.`;

  window.open(
    "https://wa.me/55" +
      numero +
      "?text=" +
      encodeURIComponent(
        mensagem
      ),
    "_blank"
  );
}

/* =========================================================
   SALVAR LOJA
========================================================= */

async function salvarLoja() {

  const dados = {

    store_name:
      document
        .getElementById(
          "lojaNome"
        )
        .value
        .trim(),

    description:
      document
        .getElementById(
          "lojaDescricao"
        )
        .value
        .trim(),

    phone:
      document
        .getElementById(
          "lojaTelefone"
        )
        .value
        .trim(),

    whatsapp:
      document
        .getElementById(
          "lojaWhatsapp"
        )
        .value
        .trim(),

    address:
      document
        .getElementById(
          "lojaEndereco"
        )
        .value
        .trim(),

    instagram:
      document
        .getElementById(
          "lojaInstagram"
        )
        .value
        .trim(),

    opening_hours:
      document
        .getElementById(
          "lojaHorario"
        )
        .value
        .trim(),

    pix_key:
      document
        .getElementById(
          "lojaPix"
        )
        .value
        .trim(),

    delivery_fee:
      Number(
        document
          .getElementById(
            "lojaTaxa"
          )
          .value || 0
      ),

    updated_at:
      new Date().toISOString()
  };

  try {

    if (
      loja &&
      loja.id
    ) {

      const { data, error } =
        await supabaseClient
          .from("store_settings")
          .update(dados)
          .eq(
            "id",
            loja.id
          )
          .select()
          .single();

      if (error) throw error;

      loja =
        data;

    } else {

      const { data, error } =
        await supabaseClient
          .from("store_settings")
          .insert([dados])
          .select()
          .single();

      if (error) throw error;

      loja =
        data;
    }

    mostrarMensagem(
      "Informações da loja salvas!"
    );

  } catch (error) {

    console.error(error);

    mostrarMensagem(
      "Erro ao salvar: " +
      error.message,
      "error"
    );
  }
}

    pedidos.filter(p => {

        p.scheduled_date ||
        p.created_at?.slice(
          0,
          10
        );

      return data === hoje;
    });

  const faturamento =
    pedidosHoje
      .filter(
        p =>
          (p.status ||
            "pendente") !==
          "cancelado"
      )
      .reduce(
        (
          total,
          p
        ) =>
          total +
          Number(
            p.total || 0
          ),
        0
      );

  const pendentes =
    pedidos.filter(
      p =>
        (p.status ||
          "pendente") ===
        "pendente"
    ).length;

    document.getElementById(

    );

    );

  if (statPedidos) {

    statPedidos.textContent =

  }

  if (statFaturamento) {

    statFaturamento.textContent =
      "R$ " +
      dinheiro(
        faturamento
      );
  }

  if (statPendentes) {

    statPendentes.textContent =

  }

  if (badgePedidos) {

    badgePedidos.textContent =

  }

  const area =
    document.getElementById(

  if (!area) return;

  const recentes =
    pedidos.slice(

    );

  if (!recentes.length) {

    area.innerHTML =
      `<div class="small">

  area.innerHTML =

                </span>

              </div>

            </div>

            <div class="order-total">

              R$ ${dinheiro(
                p.total
              )}

            </div>

          </div>
        `;
      })
      .join("");
}


/* =========================================================
   REALTIME
========================================================= */

function iniciarRealtime() {

  if (realtimeChannel) return;

  realtimeChannel =
    supabaseClient
      .channel(
        "admin-orders-realtime"
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "orders"
        },
        async payload => {

          console.log(
            "Realtime pedido:",
            payload
          );

          if (
            payload.eventType ===
            "INSERT"
          ) {

            pedidos.unshift(
              payload.new
            );
          }

          if (
            payload.eventType ===
            "UPDATE"
          ) {

            const indice =
              pedidos.findIndex(
                p =>
                  Number(p.id) ===
                  Number(
                    payload.new.id
                  )
              );

            if (
              indice !== -1
            ) {

              pedidos[indice] =
                payload.new;

            } else {

              pedidos.unshift(
                payload.new
              );
            }

            if (
              pedidoAtual &&
              Number(
                pedidoAtual.id
              ) ===
              Number(
                payload.new.id
              )
            ) {

              pedidoAtual =
                payload.new;

              preencherDetalhePedido(
                pedidoAtual
              );

              await carregarItensDoPedido(
                pedidoAtual.id
              );
            }
          }

          if (
            payload.eventType ===
            "DELETE"
          ) {

            pedidos =
              pedidos.filter(
                p =>
                  Number(p.id) !==
                  Number(
                    payload.old.id
                  )
              );

            if (
              pedidoAtual &&
              Number(
                pedidoAtual.id
              ) ===
              Number(
                payload.old.id
              )
            ) {

              fecharPedido();
            }
          }

          renderizarPedidos();

          atualizarDashboard();

          mostrarMensagem(
            "Pedido atualizado em tempo real."
          );
        }
      )
      .subscribe(
        status => {

          console.log(
            "Realtime:",
            status
          );

        }
      );
}
