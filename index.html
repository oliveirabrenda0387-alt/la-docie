<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lá Dociê | Confeitaria</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf7;
      color: #4b281d;
    }

    header {
      background: #4b281d;
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #d9a441;
    }

    .cart {
      background: #e0b35b;
      color: #3d241c;
      border: 0;
      border-radius: 30px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin: 0;
    }

    .hero h1 span {
      color: #d09a39;
    }

    .hero p {
      max-width: 650px;
      margin: 20px auto;
      font-size: 18px;
      line-height: 1.6;
      color: #765b51;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 20px 25px;
      max-width: 1100px;
      margin: auto;
    }

    .category {
      white-space: nowrap;
      padding: 12px 20px;
      border: 1px solid #dccfc8;
      border-radius: 30px;
      background: white;
      color: #4b281d;
      cursor: pointer;
    }

    .category.active {
      background: #4b281d;
      color: white;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(70, 35, 20, .10);
      border: 1px solid #eee1da;
    }

    .product-image {
      width: 100%;
      height: 190px;
      background: #f3e7df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 17px;
    }

    .product h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .product p {
      color: #765b51;
      min-height: 40px;
    }

    .price {
      color: #b47b20;
      font-size: 21px;
      font-weight: bold;
    }

    .add,
    .main-button,
    .confirm-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: #4b281d;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .add:hover,
    .main-button:hover,
    .confirm-button:hover {
      opacity: .9;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      font-size: 18px;
    }

    footer {
      margin-top: 60px;
      padding: 40px 20px;
      text-align: center;
      background: #4b281d;
      color: #e0b35b;
      font-size: 20px;
      font-weight: bold;
    }

    /* MODAIS */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #fffaf7;
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 22px;
      position: relative;
    }

    .modal-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .modal-title h2 {
      margin: 0;
    }

    .close {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #eee0d9;
      color: #4b281d;
      font-size: 20px;
      cursor: pointer;
    }

    .cart-item {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
    }

    .cart-item-price {
      color: #b47b20;
      margin-top: 5px;
    }

    .remove {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      background: #9b3d3d;
      border: 0;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8cbc4;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      color: #4b281d;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .option-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .option {
      background: white;
      border: 1px solid #d8cbc4;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
    }

    .option input {
      width: auto;
      margin-right: 5px;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #ffe5e5;
      color: #8b2525;
    }

    .success {
      text-align: center;
      padding: 30px 10px;
    }

    .success h2 {
      color: #4b281d;
    }

    @media (max-width: 500px) {

      .hero h1 {
        font-size: 34px;
      }

      .hero p {
        font-size: 16px;
      }

      .option-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    LÁ <span>DOCIÊ</span>
  </div>

  <button class="cart" onclick="mostrarCarrinho()">
    🛒 Carrinho
    <span id="cartCount">0</span>
  </button>

</header>


<section class="hero">

  <h1>
    Momentos mais
    <span>doces</span>
  </h1>

  <p>
    Bolos, brigadeiros, cupcakes e kits preparados
    com carinho para tornar sua comemoração inesquecível.
  </p>

</section>


<div class="categories">

  <button class="category active" onclick="filtrarProdutos('todos', this)">
    Todos
  </button>

  <button class="category" onclick="filtrarProdutos('bolos', this)">
    🎂 Bolos
  </button>

  <button class="category" onclick="filtrarProdutos('doces', this)">
    🍫 Doces
  </button>

  <button class="category" onclick="filtrarProdutos('kits', this)">
    🎁 Kits
  </button>

</div>


<section id="products" class="products">

  <div class="loading">
    Carregando nossos produtos... 🍰
  </div>

</section>


<footer>
  LÁ DOCIÊ
</footer>


<!-- ================================
     MODAL CARRINHO
================================ -->

<div id="cartModal" class="modal">

  <div class="modal-content">

    <div class="modal-title">

      <h2>🛒 Seu carrinho</h2>

      <button
        class="close"
        onclick="fecharCarrinho()"
      >
        ×
      </button>

    </div>


    <div id="cartItems"></div>


    <div class="cart-total">

      <span>Total</span>

      <span id="cartTotal">
        R$ 0,00
      </span>

    </div>


    <button
      class="main-button"
      onclick="abrirCheckout()"
    >
      Continuar pedido
    </button>

  </div>

</div>


<!-- ================================
     CHECKOUT
================================ -->

<div id="checkoutModal" class="modal">

  <div class="modal-content">

    <div class="modal-title">

      <h2>📝 Finalizar pedido</h2>

      <button
        class="close"
        onclick="fecharCheckout()"
      >
        ×
      </button>

    </div>


    <label>
      Nome completo
    </label>

    <input
      type="text"
      id="clienteNome"
      placeholder="Digite seu nome"
    >


    <label>
      WhatsApp
    </label>

    <input
      type="tel"
      id="clienteTelefone"
      placeholder="(92) 99999-9999"
    >


    <label>
      E-mail
    </label>

    <input
      type="email"
      id="clienteEmail"
      placeholder="seuemail@email.com"
    >


    <label>
      Como deseja receber?
    </label>

    <div class="option-group">

      <label class="option">

        <input
          type="radio"
          name="entrega"
          value="retirada"
          checked
          onchange="alterarEntrega()"
        >

        Retirada
      </label>


      <label class="option">

        <input
          type="radio"
          name="entrega"
          value="entrega"
          onchange="alterarEntrega()"
        >

        Entrega
      </label>

    </div>


    <div id="enderecoArea" style="display:none;">

      <label>
        Endereço de entrega
      </label>

      <textarea
        id="clienteEndereco"
        placeholder="Rua, número, bairro e complemento"
      ></textarea>

    </div>


    <label>
      Data do pedido
    </label>

    <input
      type="date"
      id="pedidoData"
    >


    <label>
      Horário
    </label>

    <input
      type="time"
      id="pedidoHorario"
    >


    <label>
      Forma de pagamento
    </label>

    <select id="pedidoPagamento">

      <option value="">
        Selecione
      </option>

      <option value="pix">
        Pix
      </option>

      <option value="cartao">
        Cartão
      </option>

      <option value="dinheiro">
        Dinheiro
      </option>

    </select>


    <label>
      Observações
    </label>

    <textarea
      id="pedidoObservacoes"
      placeholder="Alguma observação sobre o pedido?"
    ></textarea>


    <div id="checkoutErro" class="error"></div>


    <button
      id="confirmarPedido"
      class="confirm-button"
      onclick="finalizarPedido()"
    >
      ✅ Confirmar pedido
    </button>

  </div>

</div>


<!-- ================================
     SUCESSO
================================ -->

<div id="successModal" class="modal">

  <div class="modal-content">

    <div class="success">

      <div style="font-size:60px;">
        🎉
      </div>

      <h2>
        Pedido realizado!
      </h2>

      <p>
        Recebemos seu pedido com sucesso.
      </p>

      <p>
        <strong id="numeroPedido"></strong>
      </p>

      <button
        class="main-button"
        onclick="fecharSucesso()"
      >
        Voltar para a loja
      </button>

    </div>

  </div>

</div>


<script>

  /* ==================================
     SUPABASE
  ================================== */

  const SUPABASE_URL =
    "https://lzihqkpscesurkfmcasb.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_okTsv4Dxh12-D-3a2x2gyg_H37xXvnG";


  /* ==================================
     CLIENTE SUPABASE
  ================================== */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==================================
     VARIÁVEIS
  ================================== */

  let carrinho = [];

  let todosProdutos = [];


  /* ==================================
     FORMATAR PREÇO
  ================================== */

  function formatarPreco(valor) {

    return Number(valor || 0)
      .toFixed(2)
      .replace(".", ",");

  }


  /* ==================================
     CARREGAR PRODUTOS
  ================================== */

  async function carregarProdutos() {

    const area =
      document.getElementById("products");


    try {

      const resposta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?select=*",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );


      if (!resposta.ok) {

        throw new Error(
          "Erro ao carregar produtos: " +
          resposta.status
        );

      }


      const produtos =
        await resposta.json();


      todosProdutos =
        Array.isArray(produtos)
          ? produtos
          : [];


      renderizarProdutos(
        todosProdutos
      );


    } catch (erro) {

      console.error(erro);


      area.innerHTML = `
        <div class="loading">
          <strong>
            Não conseguimos carregar os produtos.
          </strong>

          <br><br>

          Tente novamente.
        </div>
      `;

    }

  }


  /* ==================================
     RENDERIZAR PRODUTOS
  ================================== */

  function renderizarProdutos(
    produtos
  ) {

    const area =
      document.getElementById("products");


    if (!produtos.length) {

      area.innerHTML = `
        <div class="loading">
          Ainda não temos produtos cadastrados. 🍰
        </div>
      `;

      return;
    }


    area.innerHTML = "";


    produtos.forEach(produto => {

      const nome =
        produto.name ||
        produto.nome ||
        produto.title ||
        "Produto Lá Dociê";


      const descricao =
        produto.description ||
        produto.descricao ||
        "";


      const preco =
        Number(
          produto.price ||
          produto.preco ||
          0
        );


      const imagem =
        produto.image_url ||
        produto.image ||
        produto.imagem_url ||
        "";


      const categoria =
        String(
          produto.category ||
          produto.categoria ||
          ""
        ).toLowerCase();


      const card =
        document.createElement("div");


      card.className =
        "product";


      card.innerHTML = `

        <div class="product-image">

          ${
            imagem

            ?

            `<img
              src="${imagem}"
              alt="${nome}"
            >`

            :

            "🍰"
          }

        </div>


        <div class="product-info">

          <h3>
            ${nome}
          </h3>

          <p>
            ${descricao}
          </p>

          <div class="price">
            R$ ${formatarPreco(preco)}
          </div>

          <button class="add">
            Adicionar ao carrinho
          </button>

        </div>

      `;


      card
        .querySelector(".add")
        .onclick = function() {

          adicionarCarrinho({
            id: produto.id || null,
            nome: nome,
            preco: preco,
            quantidade: 1
          });

        };


      area.appendChild(card);

    });

  }


  /* ==================================
     FILTRO
  ================================== */

  function filtrarProdutos(
    categoria,
    botao
  ) {

    document
      .querySelectorAll(".category")
      .forEach(item => {

        item.classList.remove("active");

      });


    botao.classList.add("active");


    if (categoria === "todos") {

      renderizarProdutos(
        todosProdutos
      );

      return;
    }


    const filtrados =
      todosProdutos.filter(produto => {

        const cat =
          String(
            produto.category ||
            produto.categoria ||
            ""
          ).toLowerCase();


        return cat.includes(
          categoria
        );

      });


    renderizarProdutos(
      filtrados
    );

  }


  /* ==================================
     ADICIONAR AO CARRINHO
  ================================== */

  function adicionarCarrinho(
    produto
  ) {

    const existente =
      carrinho.find(
        item =>
          item.id === produto.id &&
          item.nome === produto.nome
      );


    if (existente) {

      existente.quantidade++;

    } else {

      carrinho.push(produto);

    }


    atualizarCarrinho();


    alert(
      produto.nome +
      " foi adicionado ao carrinho! 🍰"
    );

  }


  /* ==================================
     TOTAL
  ================================== */

  function calcularTotal() {

    return carrinho.reduce(
      (total, item) => {

        return total +
          (
            Number(item.preco || 0) *
            Number(item.quantidade || 1)
          );

      },
      0
    );

  }


  /* ==================================
     ATUALIZAR CARRINHO
  ================================== */

  function atualizarCarrinho() {

    const quantidade =
      carrinho.reduce(
        (total, item) =>
          total +
          Number(item.quantidade || 1),
        0
      );


    document
      .getElementById("cartCount")
      .textContent =
      quantidade;


    const total =
      calcularTotal();


    document
      .getElementById("cartTotal")
      .textContent =
      "R$ " +
      formatarPreco(total);


    const area =
      document.getElementById(
        "cartItems"
      );


    if (!carrinho.length) {

      area.innerHTML = `
        <div class="loading">
          Seu carrinho está vazio. 🛒
        </div>
      `;

      return;

    }


    area.innerHTML = "";


    carrinho.forEach(
      (item, index) => {

        const div =
          document.createElement("div");


        div.className =
          "cart-item";


        div.innerHTML = `

          <div class="cart-item-info">

            <div class="cart-item-name">
              ${item.nome}
            </div>

            <div>
              Quantidade:
              ${item.quantidade}
            </div>

            <div class="cart-item-price">
              R$
              ${formatarPreco(
                item.preco *
                item.quantidade
              )}
            </div>

          </div>


          <button
            class="remove"
            onclick="removerCarrinho(${index})"
          >
            Remover
          </button>

        `;


        area.appendChild(div);

      }
    );

  }


  /* ==================================
     REMOVER
  ================================== */

  function removerCarrinho(
    index
  ) {

    carrinho.splice(
      index,
      1
    );


    atualizarCarrinho();

  }


  /* ==================================
     ABRIR CARRINHO
  ================================== */

  function mostrarCarrinho() {

    atualizarCarrinho();


    document
      .getElementById("cartModal")
      .classList.add("show");

  }


  /* ==================================
     FECHAR CARRINHO
  ================================== */

  function fecharCarrinho() {

    document
      .getElementById("cartModal")
      .classList.remove("show");

  }


  /* ==================================
     ABRIR CHECKOUT
  ================================== */

  function abrirCheckout() {

    if (!carrinho.length) {

      alert(
        "Seu carrinho está vazio. 🍰"
      );

      return;

    }


    fecharCarrinho();


    document
      .getElementById("checkoutModal")
      .classList.add("show");

  }


  /* ==================================
     FECHAR CHECKOUT
  ================================== */

  function fecharCheckout() {

    document
      .getElementById("checkoutModal")
      .classList.remove("show");

  }


  /* ==================================
     ENTREGA / RETIRADA
  ================================== */

  function alterarEntrega() {

    const selecionado =
      document.querySelector(
        'input[name="entrega"]:checked'
      );


    const area =
      document.getElementById(
        "enderecoArea"
      );


    if (
      selecionado &&
      selecionado.value === "entrega"
    ) {

      area.style.display =
        "block";

    } else {

      area.style.display =
        "none";

      document
        .getElementById(
          "clienteEndereco"
        )
        .value = "";

    }

  }


  /* ==================================
     MOSTRAR ERRO
  ================================== */

  function mostrarErro(
    mensagem
  ) {

    const area =
      document.getElementById(
        "checkoutErro"
      );


    area.innerHTML =
      mensagem;


    area.style.display =
      "block";

  }


  /* ==================================
     FINALIZAR PEDIDO
  ================================== */

  async function finalizarPedido() {

    const erro =
      document.getElementById(
        "checkoutErro"
      );


    const botao =
      document.getElementById(
        "confirmarPedido"
      );


    erro.style.display =
      "none";


    if (!carrinho.length) {

      mostrarErro(
        "Seu carrinho está vazio."
      );

      return;

    }


    const nome =
      document
        .getElementById(
          "clienteNome"
        )
        .value
        .trim();


    const telefone =
      document
        .getElementById(
          "clienteTelefone"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "clienteEmail"
        )
        .value
        .trim();


    const entrega =
      document.querySelector(
        'input[name="entrega"]:checked'
      );


    const data =
      document
        .getElementById(
          "pedidoData"
        )
        .value;


    const horario =
      document
        .getElementById(
          "pedidoHorario"
        )
        .value;


    const pagamento =
      document
        .getElementById(
          "pedidoPagamento"
        )
        .value;


    const endereco =
      document
        .getElementById(
          "clienteEndereco"
        )
        .value
        .trim();


    const observacoes =
      document
        .getElementById(
          "pedidoObservacoes"
        )
        .value
        .trim();


    /* VALIDAÇÕES */

    if (!nome) {

      mostrarErro(
        "Digite seu nome."
      );

      return;

    }


    if (!telefone) {

      mostrarErro(
        "Digite seu WhatsApp."
      );

      return;

    }


    if (!data) {

      mostrarErro(
        "Escolha a data do pedido."
      );

      return;

    }


    if (!horario) {

      mostrarErro(
        "Escolha o horário."
      );

      return;

    }


    if (!pagamento) {

      mostrarErro(
        "Escolha a forma de pagamento."
      );

      return;

    }


    const tipoEntrega =
      entrega
        ? entrega.value
        : "retirada";


    if (
      tipoEntrega === "entrega" &&
      !endereco
    ) {

      mostrarErro(
        "Digite o endereço de entrega."
      );

      return;

    }


    /* DESABILITAR BOTÃO */

    botao.disabled =
      true;

    botao.textContent =
      "Enviando pedido...";


    try {

      const itens =
        carrinho.map(item => ({

          product_id:
            item.id
              ? String(item.id)
              : null,

          name:
            item.nome,

          qty:
            Number(
              item.quantidade || 1
            ),

          price:
            Number(
              item.preco || 0
            )

        }));


      const total =
        calcularTotal();


      /* CHAMAR FUNÇÃO DO SUPABASE */

      const resposta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/rpc/criar_pedido",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY

            },

            body:
              JSON.stringify({

                p_customer_name:
                  nome,

                p_customer_phone:
                  telefone,

                p_customer_email:
                  email || null,

                p_type:
                  tipoEntrega,

                p_scheduled_date:
                  data,

                p_scheduled_time:
                  horario,

                p_total:
                  total,

                p_payment_method:
                  pagamento,

                p_delivery_type:
                  tipoEntrega,

                p_delivery_address:
                  tipoEntrega === "entrega"
                    ? endereco
                    : null,

                p_notes:
                  observacoes || null,

                p_items:
                  itens

              })

          }
        );


      const texto =
        await resposta.text();


      console.log(
        "RESPOSTA DO PEDIDO:",
        texto
      );


      if (!resposta.ok) {

        let mensagem =
          texto;


        try {

          const json =
            JSON.parse(texto);


          mensagem =
            json.message ||
            json.details ||
            json.hint ||
            texto;

        } catch (e) {}


        throw new Error(
          mensagem
        );

      }


      let pedidoId;


      try {

        pedidoId =
          JSON.parse(texto);

      } catch (e) {

        pedidoId =
          texto;

      }


      /* LIMPAR CARRINHO */

      carrinho = [];


      atualizarCarrinho();


      fecharCheckout();


      /* MOSTRAR SUCESSO */

      document
        .getElementById(
          "numeroPedido"
        )
        .textContent =
        "Pedido nº " +
        pedidoId;


      document
        .getElementById(
          "successModal"
        )
        .classList.add("show");


      /* LIMPAR FORMULÁRIO */

      document
        .getElementById(
          "clienteNome"
        )
        .value = "";


      document
        .getElementById(
          "clienteTelefone"
        )
        .value = "";


      document
        .getElementById(
          "clienteEmail"
        )
        .value = "";


      document
        .getElementById(
          "clienteEndereco"
        )
        .value = "";


      document
        .getElementById(
          "pedidoData"
        )
        .value = "";


      document
        .getElementById(
          "pedidoHorario"
        )
        .value = "";


      document
        .getElementById(
          "pedidoObservacoes"
        )
        .value = "";


    } catch (erroFinal) {

      console.error(
        "ERRO AO FINALIZAR PEDIDO:",
        erroFinal
      );


      mostrarErro(
        "Não foi possível finalizar o pedido." +
        "<br><br>" +
        "<strong>Detalhes:</strong><br>" +
        (
          erroFinal.message ||
          "Erro desconhecido."
        )
      );


    } finally {

      botao.disabled =
        false;

      botao.textContent =
        "✅ Confirmar pedido";

    }

  }


  /* ==================================
     FECHAR SUCESSO
  ================================== */

  function fecharSucesso() {

    document
      .getElementById(
        "successModal"
      )
      .classList.remove("show");

  }


  /* ==================================
     DATA MÍNIMA = HOJE
  ================================== */

  function configurarData() {

    const campo =
      document.getElementById(
        "pedidoData"
      );


    const hoje =
      new Date();


    const ano =
      hoje.getFullYear();


    const mes =
      String(
        hoje.getMonth() + 1
      ).padStart(2, "0");


    const dia =
      String(
        hoje.getDate()
      ).padStart(2, "0");


    campo.min =
      `${ano}-${mes}-${dia}`;

  }


  /* ==================================
     INICIAR
  ================================== */

  carregarProdutos();

  atualizarCarrinho();

  configurarData();

</script>

</body>
</html>
