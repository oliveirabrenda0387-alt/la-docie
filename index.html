<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lá Dociê | Confeitaria</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f4f1;color:#3f261d}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

:root{
 --brown:#4b281d;
 --gold:#d8aa52;
 --cream:#fffaf7;
 --text:#3f261d;
 --muted:#806d64;
 --border:#eadfd8;
}

header{
 background:#fff;
 position:sticky;
 top:0;
 z-index:50;
 border-bottom:1px solid var(--border)
}

.top{
 max-width:1200px;
 margin:auto;
 padding:13px 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px
}

.logo{
 font-size:24px;
 font-weight:900;
 color:var(--brown)
}
.logo span{color:var(--gold)}

.header-actions{
 display:flex;
 gap:8px;
 align-items:center
}

.icon-btn{
 border:0;
 background:#f7f1ed;
 width:45px;
 height:45px;
 border-radius:50%;
 font-size:19px
}

.cart-btn{
 border:0;
 background:var(--brown);
 color:white;
 padding:11px 16px;
 border-radius:24px;
 font-weight:bold
}

.hero{
 max-width:1200px;
 margin:auto;
 padding:25px 18px 10px
}

.hero-box{
 background:linear-gradient(135deg,#4b281d,#704536);
 color:white;
 border-radius:22px;
 padding:32px 25px;
 position:relative;
 overflow:hidden
}

.hero-box:after{
 content:"🍰";
 position:absolute;
 right:25px;
 bottom:-15px;
 font-size:105px;
 opacity:.15
}

.hero h1{
 margin:0 0 9px;
 font-size:34px
}

.hero h1 span{color:#f1cb79}

.hero p{
 margin:0;
 max-width:620px;
 line-height:1.6;
 color:#f4e9e3
}

.search{
 max-width:1200px;
 margin:18px auto 0;
 padding:0 18px
}

.search-box{
 background:white;
 border:1px solid var(--border);
 border-radius:14px;
 padding:12px 15px;
 display:flex;
 gap:10px;
 align-items:center
}

.search-box span{font-size:20px}

.search-box input{
 border:0;
 outline:0;
 width:100%;
 background:transparent
}

.categories{
 max-width:1200px;
 margin:auto;
 padding:18px;
 display:flex;
 gap:9px;
 overflow-x:auto
}

.category{
 white-space:nowrap;
 border:1px solid var(--border);
 background:white;
 color:var(--brown);
 padding:10px 17px;
 border-radius:22px
}

.category.active{
 background:var(--brown);
 color:white;
 border-color:var(--brown)
}

.section{
 max-width:1200px;
 margin:auto;
 padding:0 18px 45px
}

.section-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:15px
}

.section-title h2{
 margin:0;
 font-size:22px
}

.count{
 color:var(--muted);
 font-size:13px
}

.products{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:17px
}

.card{
 background:white;
 border-radius:17px;
 overflow:hidden;
 border:1px solid var(--border);
 box-shadow:0 3px 13px rgba(70,35,20,.06);
 transition:.2s
}

.card:hover{
 transform:translateY(-2px);
 box-shadow:0 8px 20px rgba(70,35,20,.10)
}

.image{
 height:190px;
 background:#f1e6df;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:55px;
 overflow:hidden
}

.image img{
 width:100%;
 height:100%;
 object-fit:cover
}

.card-body{padding:15px}

.card h3{
 margin:0 0 7px;
 font-size:17px
}

.card p{
 color:var(--muted);
 font-size:13px;
 line-height:1.45;
 min-height:38px;
 margin:0 0 12px
}

.bottom{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px
}

.price{
 color:#ae751b;
 font-size:19px;
 font-weight:900
}

.add{
 border:0;
 background:var(--brown);
 color:white;
 border-radius:10px;
 padding:9px 12px;
 font-weight:bold
}

.loading,.empty{
 text-align:center;
 padding:55px 20px;
 color:var(--muted);
 grid-column:1/-1
}

footer{
 background:var(--brown);
 color:white;
 padding:35px 20px;
 text-align:center
}

.footer-logo{
 font-size:23px;
 font-weight:bold;
 color:var(--gold)
}

.footer-info{
 margin-top:12px;
 color:#eee0d9;
 line-height:1.8;
 font-size:14px
}

/* MODAIS */

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 z-index:100;
 align-items:flex-end;
 justify-content:center
}

.modal.show{display:flex}

.modal-box{
 background:var(--cream);
 width:100%;
 max-width:650px;
 max-height:92vh;
 overflow:auto;
 border-radius:22px 22px 0 0;
 padding:20px
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:12px
}

.modal-head h2{margin:0}

.close{
 border:0;
 background:#eaded7;
 width:38px;
 height:38px;
 border-radius:50%;
 font-size:20px
}

/* CARRINHO */

.cart-item{
 background:white;
 border:1px solid var(--border);
 border-radius:13px;
 padding:13px;
 margin:9px 0;
 display:flex;
 justify-content:space-between;
 gap:12px
}

.cart-name{font-weight:bold}

.cart-controls{
 display:flex;
 align-items:center;
 gap:7px;
 margin-top:8px
}

.qty{
 border:0;
 background:#f0e7e2;
 width:31px;
 height:31px;
 border-radius:8px;
 font-weight:bold
}

.cart-price{
 color:#ad741c;
 font-weight:bold;
 margin-top:6px
}

.total{
 display:flex;
 justify-content:space-between;
 border-top:1px solid var(--border);
 padding-top:15px;
 margin-top:15px;
 font-size:20px;
 font-weight:bold
}

.primary{
 width:100%;
 margin-top:14px;
 border:0;
 background:var(--brown);
 color:white;
 padding:14px;
 border-radius:12px;
 font-weight:bold
}

.secondary{
 width:100%;
 margin-top:9px;
 border:0;
 background:#eaded7;
 color:var(--brown);
 padding:13px;
 border-radius:12px;
 font-weight:bold
}

/* CHECKOUT */

label{
 display:block;
 font-weight:bold;
 margin:13px 0 6px
}

input,textarea,select{
 width:100%;
 padding:12px;
 border:1px solid #d8cbc4;
 border-radius:10px;
 background:white;
 color:var(--brown);
 outline:none
}

textarea{
 min-height:75px;
 resize:vertical
}

.delivery-options{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.delivery-option{
 border:1px solid #d8cbc4;
 background:white;
 border-radius:12px;
 padding:13px;
 cursor:pointer
}

.delivery-option input{
 width:auto
}

.error{
 display:none;
 background:#ffe2e2;
 color:#8c2525;
 padding:12px;
 border-radius:10px;
 margin-top:12px
}

.error.show{display:block}

.success{
 text-align:center;
 padding:25px 10px
}

.success-icon{font-size:65px}

.badge{
 display:inline-block;
 padding:4px 8px;
 background:#f3e4bd;
 color:#80580f;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
 margin-bottom:7px
}

@media(max-width:900px){
 .products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:650px){
 .products{grid-template-columns:repeat(2,1fr);gap:10px}
 .image{height:150px}
 .card-body{padding:12px}
 .card h3{font-size:15px}
 .card p{font-size:12px}
 .price{font-size:16px}
 .add{font-size:12px;padding:8px}
 .hero h1{font-size:28px}
}

@media(max-width:400px){
 .products{grid-template-columns:1fr}
 .image{height:190px}
}
</style>
</head>

<body>

<header>
 <div class="top">
   <div class="logo" id="logo">LÁ <span>DOCIÊ</span></div>

   <div class="header-actions">
     <button class="icon-btn" onclick="mostrarCarrinho()">🛒</button>
     <button class="cart-btn" onclick="mostrarCarrinho()">
       Carrinho <span id="cartCount">0</span>
     </button>
   </div>
 </div>
</header>

<section class="hero">
 <div class="hero-box">
   <h1 id="heroTitle">Momentos mais <span>doces</span></h1>
   <p id="heroDescription">
     Bolos, brigadeiros, cupcakes e kits preparados com carinho.
   </p>
 </div>
</section>

<div class="search">
 <div class="search-box">
   <span>🔎</span>
   <input
     id="busca"
     type="search"
     placeholder="Buscar produtos..."
     oninput="buscarProdutos()"
   >
 </div>
</div>

<nav class="categories">
 <button class="category active" onclick="filtrar('todos',this)">
   Todos
 </button>
 <button class="category" onclick="filtrar('bolos',this)">
   🎂 Bolos
 </button>
 <button class="category" onclick="filtrar('doces',this)">
   🍫 Doces
 </button>
 <button class="category" onclick="filtrar('kits',this)">
   🎁 Kits
 </button>
 <button class="category" onclick="filtrar('outros',this)">
   🍰 Outros
 </button>
</nav>

<section class="section">

 <div class="section-title">
   <h2>Delícias da Lá Dociê</h2>
   <span class="count" id="contadorProdutos"></span>
 </div>

 <div id="products" class="products">
   <div class="loading">Carregando produtos... 🍰</div>
 </div>

</section>

<footer>
 <div class="footer-logo" id="footerName">LÁ DOCIÊ</div>

 <div class="footer-info">
   <div id="footerAddress"></div>
   <div id="footerPhone"></div>
   <div id="footerWhatsapp"></div>
   <div id="footerInstagram"></div>
   <div id="footerHours"></div>
 </div>
</footer>


<!-- CARRINHO -->

<div id="cartModal" class="modal">
 <div class="modal-box">

   <div class="modal-head">
     <h2>🛒 Meu carrinho</h2>
     <button class="close" onclick="fecharCarrinho()">×</button>
   </div>

   <div id="cartItems"></div>

   <div class="total">
     <span>Total</span>
     <span id="cartTotal">R$ 0,00</span>
   </div>

   <button class="primary" onclick="abrirCheckout()">
     Continuar pedido
   </button>

   <button class="secondary" onclick="fecharCarrinho()">
     Continuar comprando
   </button>

 </div>
</div>


<!-- CHECKOUT -->

<div id="checkoutModal" class="modal">
 <div class="modal-box">

   <div class="modal-head">
     <h2>📦 Finalizar pedido</h2>
     <button class="close" onclick="fecharCheckout()">×</button>
   </div>

   <label>Nome completo</label>
   <input id="clienteNome" placeholder="Digite seu nome">

   <label>WhatsApp</label>
   <input id="clienteTelefone" type="tel" placeholder="(92) 99999-9999">

   <label>E-mail</label>
   <input id="clienteEmail" type="email" placeholder="seuemail@email.com">

   <label>Como deseja receber?</label>

   <div class="delivery-options">

     <label class="delivery-option">
       <input
         type="radio"
         name="entrega"
         value="retirada"
         checked
         onchange="alterarEntrega()"
       >
       🏪 Retirada
     </label>

     <label class="delivery-option">
       <input
         type="radio"
         name="entrega"
         value="entrega"
         onchange="alterarEntrega()"
       >
       🛵 Entrega
     </label>

   </div>

   <div id="enderecoArea" style="display:none">

     <label>Endereço</label>

     <textarea
       id="clienteEndereco"
       placeholder="Rua, número, bairro e complemento"
     ></textarea>

     <div
       id="taxaEntrega"
       style="margin-top:8px;font-weight:bold;color:#a96f18"
     ></div>

   </div>

   <label>Data do pedido</label>
   <input id="pedidoData" type="date">

   <label>Horário</label>
   <input id="pedidoHorario" type="time">

   <label>Forma de pagamento</label>

   <select id="pedidoPagamento">
     <option value="">Selecione</option>
     <option value="pix">Pix</option>
     <option value="cartao">Cartão</option>
     <option value="dinheiro">Dinheiro</option>
   </select>

   <label>Observações</label>

   <textarea
     id="pedidoObservacoes"
     placeholder="Alguma observação sobre seu pedido?"
   ></textarea>

   <div id="checkoutErro" class="error"></div>

   <button
     id="confirmarPedido"
     class="primary"
     onclick="finalizarPedido()"
   >
     ✅ Confirmar pedido
   </button>

 </div>
</div>


<!-- SUCESSO -->

<div id="successModal" class="modal">
 <div class="modal-box">

   <div class="success">

     <div class="success-icon">🎉</div>

     <h2>Pedido realizado!</h2>

     <p>Recebemos seu pedido com sucesso.</p>

     <p>
       <strong id="numeroPedido"></strong>
     </p>

     <button class="primary" onclick="fecharSucesso()">
       Voltar para a loja
     </button>

   </div>

 </div>
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lzihqkpscesurkfmcasb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_okTsv4Dxh12-D-3a2x2gyg_H37xXvnG";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
   ESTADO
===================================================== */

let todosProdutos = [];
let produtosExibidos = [];
let carrinho = [];
let configuracoes = {};
let categoriaAtual = "todos";


/* =====================================================
   UTILIDADES
===================================================== */

function dinheiro(valor){
 return Number(valor || 0)
   .toFixed(2)
   .replace(".",",");
}

function escapeHTML(valor){
 return String(valor ?? "")
   .replaceAll("&","&amp;")
   .replaceAll("<","&lt;")
   .replaceAll(">","&gt;")
   .replaceAll('"',"&quot;")
   .replaceAll("'","&#039;");
}


/* =====================================================
   CONFIGURAÇÕES DA LOJA
===================================================== */

async function carregarConfiguracoes(){

 try{

   const {data,error} =
     await supabaseClient
       .from("store_settings")
       .select("*")
       .limit(1)
       .maybeSingle();

   if(error) throw error;

   if(!data) return;

   configuracoes = data;

   const nome =
     data.store_name || "LÁ DOCIÊ";

   document.getElementById("logo").innerHTML =
     escapeHTML(nome);

   document.getElementById("footerName").textContent =
     nome;

   document.getElementById("heroDescription").textContent =
     data.description ||
     "Bolos, brigadeiros, cupcakes e kits preparados com carinho.";

   document.getElementById("footerAddress").textContent =
     data.address ? "📍 " + data.address : "";

   document.getElementById("footerPhone").textContent =
     data.phone ? "📞 " + data.phone : "";

   document.getElementById("footerWhatsapp").textContent =
     data.whatsapp ? "📱 " + data.whatsapp : "";

   document.getElementById("footerInstagram").textContent =
     data.instagram ? "📸 " + data.instagram : "";

   document.getElementById("footerHours").textContent =
     data.opening_hours ? "🕐 " + data.opening_hours : "";

 }catch(error){

   console.error(
     "Configurações:",
     error
   );

 }

}


/* =====================================================
   PRODUTOS
===================================================== */

async function carregarProdutos(){

 const area =
   document.getElementById("products");

 area.innerHTML =
   '<div class="loading">Carregando produtos... 🍰</div>';

 try{

   const {data,error} =
     await supabaseClient
       .from("products")
       .select("*")
       .eq("active",true)
       .order("name",{ascending:true});

   if(error) throw error;

   todosProdutos =
     Array.isArray(data) ? data : [];

   aplicarFiltros();

 }catch(error){

   console.error(
     "Produtos:",
     error
   );

   area.innerHTML =
     '<div class="empty">Não conseguimos carregar os produtos.</div>';

 }

}


/* =====================================================
   FILTRO
===================================================== */

function filtrar(categoria,botao){

 categoriaAtual = categoria;

 document
   .querySelectorAll(".category")
   .forEach(item =>
     item.classList.remove("active")
   );

 botao.classList.add("active");

 aplicarFiltros();

}


/* =====================================================
   BUSCA
===================================================== */

function buscarProdutos(){

 aplicarFiltros();

}


/* =====================================================
   APLICAR FILTROS
===================================================== */

function aplicarFiltros(){

 const busca =
   document
     .getElementById("busca")
     .value
     .trim()
     .toLowerCase();

 produtosExibidos =
   todosProdutos.filter(produto => {

     const categoria =
       String(
         produto.category || ""
       ).toLowerCase();

     const nome =
       String(
         produto.name || ""
       ).toLowerCase();

     const descricao =
       String(
         produto.description || ""
       ).toLowerCase();

     const categoriaOk =
       categoriaAtual === "todos" ||
       categoria.includes(categoriaAtual);

     const buscaOk =
       !busca ||
       nome.includes(busca) ||
       descricao.includes(busca);

     return categoriaOk && buscaOk;

   });

 renderizarProdutos();

}


/* =====================================================
   RENDER PRODUTOS
===================================================== */

function renderizarProdutos(){

 const area =
   document.getElementById("products");

 const contador =
   document.getElementById("contadorProdutos");

 contador.textContent =
   produtosExibidos.length +
   (produtosExibidos.length === 1
     ? " produto"
     : " produtos");

 if(!produtosExibidos.length){

   area.innerHTML =
     '<div class="empty">Nenhum produto encontrado. 🍰</div>';

   return;

 }

 area.innerHTML = "";

 produtosExibidos.forEach(produto => {

   const card =
     document.createElement("article");

   card.className = "card";

   const imagem =
     produto.image
       ? `<img
            src="${escapeHTML(produto.image)}"
            alt="${escapeHTML(produto.name)}"
            loading="lazy"
          >`
       : "🍰";

   card.innerHTML = `

     <div class="image">
       ${imagem}
     </div>

     <div class="card-body">

       <span class="badge">
         ${escapeHTML(produto.category || "Produto")}
       </span>

       <h3>
         ${escapeHTML(produto.name)}
       </h3>

       <p>
         ${escapeHTML(produto.description || "")}
       </p>

       <div class="bottom">

         <div class="price">
           R$ ${dinheiro(produto.price)}
         </div>

         <button class="add">
           + Adicionar
         </button>

       </div>

     </div>
   `;

   card
     .querySelector(".add")
     .onclick = () => {

       adicionarCarrinho({
         id:produto.id,
         nome:produto.name,
         preco:Number(produto.price || 0),
         quantidade:1
       });

     };

   area.appendChild(card);

 });

}


/* =====================================================
   CARRINHO
===================================================== */

function adicionarCarrinho(produto){

 const existente =
   carrinho.find(
     item => String(item.id) === String(produto.id)
   );

 if(existente){

   existente.quantidade++;

 }else{

   carrinho.push(produto);

 }

 atualizarCarrinho();

 mostrarCarrinho();

}


function diminuirQuantidade(index){

 if(!carrinho[index]) return;

 carrinho[index].quantidade--;

 if(carrinho[index].quantidade <= 0){

   carrinho.splice(index,1);

 }

 atualizarCarrinho();

}


function aumentarQuantidade(index){

 if(!carrinho[index]) return;

 carrinho[index].quantidade++;

 atualizarCarrinho();

}


function calcularTotal(){

 return carrinho.reduce(
   (total,item) =>
     total +
     Number(item.preco || 0) *
     Number(item.quantidade || 1),
   0
 );

}


function atualizarCarrinho(){

 const quantidade =
   carrinho.reduce(
     (total,item) =>
       total +
       Number(item.quantidade || 0),
     0
   );

 document.getElementById("cartCount")
   .textContent = quantidade;

 document.getElementById("cartTotal")
   .textContent =
   "R$ " + dinheiro(calcularTotal());

 const area =
   document.getElementById("cartItems");

 if(!carrinho.length){

   area.innerHTML =
     '<div class="empty">Seu carrinho está vazio. 🛒</div>';

   return;

 }

 area.innerHTML = "";

 carrinho.forEach((item,index) => {

   const div =
     document.createElement("div");

   div.className = "cart-item";

   div.innerHTML = `

     <div>

       <div class="cart-name">
         ${escapeHTML(item.nome)}
       </div>

       <div class="cart-price">
         R$ ${dinheiro(
           Number(item.preco) *
           Number(item.quantidade)
         )}
       </div>

       <div class="cart-controls">

         <button
           class="qty"
           onclick="diminuirQuantidade(${index})">
           −
         </button>

         <strong>
           ${item.quantidade}
         </strong>

         <button
           class="qty"
           onclick="aumentarQuantidade(${index})">
           +
         </button>

       </div>

     </div>

   `;

   area.appendChild(div);

 });

}


function mostrarCarrinho(){

 atualizarCarrinho();

 document
   .getElementById("cartModal")
   .classList.add("show");

}


function fecharCarrinho(){

 document
   .getElementById("cartModal")
   .classList.remove("show");

}


/* =====================================================
   CHECKOUT
===================================================== */

function abrirCheckout(){

 if(!carrinho.length){

   alert("Seu carrinho está vazio. 🍰");
   return;

 }

 fecharCarrinho();

 document
   .getElementById("checkoutModal")
   .classList.add("show");

 alterarEntrega();

}


function fecharCheckout(){

 document
   .getElementById("checkoutModal")
   .classList.remove("show");

}


function alterarEntrega(){

 const escolha =
   document.querySelector(
     'input[name="entrega"]:checked'
   );

 const area =
   document.getElementById("enderecoArea");

 const taxa =
   document.getElementById("taxaEntrega");

 if(escolha &&
    escolha.value === "entrega"){

   area.style.display = "block";

   const valor =
     Number(
       configuracoes.delivery_fee || 0
     );

   taxa.textContent =
     "🛵 Taxa de entrega: R$ " +
     dinheiro(valor);

 }else{

   area.style.display = "none";
   taxa.textContent = "";

 }

}


function mostrarErro(mensagem){

 const erro =
   document.getElementById("checkoutErro");

 erro.textContent = mensagem;

 erro.classList.add("show");

}


function esconderErro(){

 document
   .getElementById("checkoutErro")
   .classList.remove("show");

}


/* =====================================================
   FINALIZAR PEDIDO
===================================================== */

async function finalizarPedido(){

 esconderErro();

 if(!carrinho.length){

   mostrarErro("Seu carrinho está vazio.");
   return;

 }

 const nome =
   document.getElementById("clienteNome")
   .value.trim();

 const telefone =
   document.getElementById("clienteTelefone")
   .value.trim();

 const email =
   document.getElementById("clienteEmail")
   .value.trim();

 const entrega =
   document.querySelector(
     'input[name="entrega"]:checked'
   );

 const data =
   document.getElementById("pedidoData")
   .value;

 const horario =
   document.getElementById("pedidoHorario")
   .value;

 const pagamento =
   document.getElementById("pedidoPagamento")
   .value;

 const endereco =
   document.getElementById("clienteEndereco")
   .value.trim();

 const observacoes =
   document.getElementById("pedidoObservacoes")
   .value.trim();

 if(!nome){

   mostrarErro("Digite seu nome.");
   return;

 }

 if(!telefone){

   mostrarErro("Digite seu WhatsApp.");
   return;

 }

 if(!data){

   mostrarErro("Escolha a data do pedido.");
   return;

 }

 if(!horario){

   mostrarErro("Escolha o horário.");
   return;

 }

 if(!pagamento){

   mostrarErro("Escolha a forma de pagamento.");
   return;

 }

 const tipoEntrega =
   entrega
     ? entrega.value
     : "retirada";

 if(
   tipoEntrega === "entrega" &&
   !endereco
 ){

   mostrarErro(
     "Digite o endereço de entrega."
   );

   return;

 }

 const botao =
   document.getElementById(
     "confirmarPedido"
   );

 botao.disabled = true;

 botao.textContent =
   "Enviando pedido...";

 try{

   const taxa =
     tipoEntrega === "entrega"
       ? Number(
           configuracoes.delivery_fee || 0
         )
       : 0;

   const subtotal =
     calcularTotal();

   const total =
     subtotal + taxa;

   const itens =
     carrinho.map(item => ({
       product_id:item.id,
       name:item.nome,
       qty:Number(item.quantidade || 1),
       price:Number(item.preco || 0)
     }));

   const resposta =
     await fetch(
       SUPABASE_URL +
       "/rest/v1/rpc/criar_pedido",
       {
         method:"POST",
         headers:{
           "Content-Type":
             "application/json",
           "apikey":
             SUPABASE_KEY,
           "Authorization":
             "Bearer " + SUPABASE_KEY
         },
         body:JSON.stringify({

           p_customer_name:
             nome,

           p_customer_phone:
             telefone,

           p_customer_email:
             email || null,

           p_type:
             tipoEntrega,

           p_scheduled_date:
             data,

           p_scheduled_time:
             horario,

           p_total:
             total,

           p_payment_method:
             pagamento,

           p_delivery_type:
             tipoEntrega,

           p_delivery_address:
             tipoEntrega === "entrega"
               ? endereco
               : null,

           p_notes:
             observacoes || null,

           p_items:
             itens

         })
       }
     );

   const texto =
     await resposta.text();

   if(!resposta.ok){

     throw new Error(texto);

   }

   let pedidoId;

   try{

     pedidoId =
       JSON.parse(texto);

   }catch{

     pedidoId =
       texto;

   }

   carrinho = [];

   atualizarCarrinho();

   fecharCheckout();

   document.getElementById(
     "numeroPedido"
   ).textContent =
     "Pedido nº " + pedidoId;

   document
     .getElementById("successModal")
     .classList.add("show");

   limparFormulario();

 }catch(error){

   console.error(
     "Finalizar pedido:",
     error
   );

   mostrarErro(
     "Não foi possível finalizar o pedido. Tente novamente."
   );

 }finally{

   botao.disabled = false;

   botao.textContent =
     "✅ Confirmar pedido";

 }

}


/* =====================================================
   LIMPAR CHECKOUT
===================================================== */

function limparFormulario(){

 [
   "clienteNome",
   "clienteTelefone",
   "clienteEmail",
   "clienteEndereco",
   "pedidoData",
   "pedidoHorario",
   "pedidoObservacoes"
 ].forEach(id => {

   const elemento =
     document.getElementById(id);

   if(elemento){
     elemento.value = "";
   }

 });

 document.getElementById(
   "pedidoPagamento"
 ).value = "";

 const retirada =
   document.querySelector(
     'input[name="entrega"][value="retirada"]'
   );

 if(retirada){

   retirada.checked = true;

 }

 alterarEntrega();

}


/* =====================================================
   SUCESSO
===================================================== */

function fecharSucesso(){

 document
   .getElementById("successModal")
   .classList.remove("show");

}


/* =====================================================
   DATA MÍNIMA
===================================================== */

function configurarData(){

 const hoje =
   new Date();

 const ano =
   hoje.getFullYear();

 const mes =
   String(
     hoje.getMonth()+1
   ).padStart(2,"0");

 const dia =
   String(
     hoje.getDate()
   ).padStart(2,"0");

 document.getElementById(
   "pedidoData"
 ).min =
   `${ano}-${mes}-${dia}`;

}


/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
===================================================== */

/*
   O site verifica o banco a cada 30 segundos.
   Assim, alterações feitas no painel aparecem
   para o cliente sem precisar deixar o navegador
   aberto eternamente.
*/

setInterval(async () => {

 try{

   await carregarConfiguracoes();
   await carregarProdutos();

 }catch(error){

   console.error(
     "Atualização automática:",
     error
   );

 }

},30000);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function iniciar(){

 configurarData();

 atualizarCarrinho();

 await Promise.all([
   carregarConfiguracoes(),
   carregarProdutos()
 ]);

}


iniciar();

</script>
